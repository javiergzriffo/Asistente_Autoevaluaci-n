<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#243047;background:#f4f6fa;font-size:14px}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}
header{background:#17243d;color:white;padding:14px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #15223c22}

.fortaleza{background:#d9f2e5;color:#16633d}.oportunidad{background:#fff0d4;color:#8b5800}.neutral{background:#e9eef5;color:#4c5d75}.atendida{background:#d7f2e4;color:#176740}.atencion{background:#dcecfb;color:#245f96}.noatendida{background:#ffe1e3;color:#a33340}.tarea{background:#ede3fc;color:#65469b}

textarea{resize:vertical;min-height:76px}input[type=checkbox]{width:auto}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}

.taglist{display:flex;gap:6px;flex-wrap:wrap}.cardbtn{text-align:left;width:100%;margin:4px 0}
.bar{height:10px;background:#e9edf2;border-radius:10px;overflow:hidden;display:flex}.bar span{height:100%}

table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #e5eaf0;padding:9px;vertical-align:top}th{color:#5d6b80;font-size:12px}
@media(max-width:760px){.split{grid-template-columns:1fr}header{position:static}main{margin:12px auto;padding:0 10px 50px}.panel{padding:14px}}

const TEMPLATE={"titulo": "Lista de verificación editable — Pedagogías CNA", "tipo": "propuesta_operacional_no_texto_oficial", "version": "1.0", "dimensiones": [{"id": "DI", "nombre": "Docencia y resultados del proceso formativo", "criterios": [{"id": "C1", "numero": 1, "nombre": "Perfil de egreso", "niveles": [{"numero": 1, "items": [{"id": "C1-N1-01", "texto": "El perfil de egreso está formalizado.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N1-02", "texto": "El perfil de egreso se difunde a la comunidad.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N1-03", "texto": "El perfil es coherente con los fundamentos de la profesión docente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N1-04", "texto": "El perfil es coherente con los estándares pedagógicos y disciplinarios vigentes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N1-05", "texto": "El perfil es consistente con el proyecto institucional y el modelo educativo.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N1-06", "texto": "El perfil orienta la implementación del plan de estudios.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N1-07", "texto": "El perfil es consistente con el título y grado otorgados.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 2, "items": [{"id": "C1-N2-01", "texto": "La formulación del perfil considera validación con actores internos.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N2-02", "texto": "La formulación del perfil considera validación con actores externos.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N2-03", "texto": "El perfil es conocido por profesores y estudiantes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N2-04", "texto": "El perfil es conocido por empleadores y centros de práctica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N2-05", "texto": "Existe un procedimiento formalizado de monitoreo del logro del perfil.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N2-06", "texto": "El monitoreo considera los resultados de la Evaluación Nacional Diagnóstica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 3, "items": [{"id": "C1-N3-01", "texto": "El diseño y validación del perfil sigue un proceso sistemático.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N3-02", "texto": "El proceso incorpora actores internos y externos relevantes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N3-03", "texto": "La validación se integra en un sistema formalizado de gestión curricular.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N3-04", "texto": "El sistema contempla evaluación periódica del perfil.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N3-05", "texto": "El perfil orienta la evaluación de desempeños durante la trayectoria formativa.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N3-06", "texto": "Se sistematizan resultados de inserción laboral de titulados.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N3-07", "texto": "Se sistematiza el seguimiento de titulados.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N3-08", "texto": "La información de titulados se incorpora a la evaluación periódica del perfil.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}], "oficial": {"descripcion": "El Perfil de egreso es la declaración que expresa los objetivos, competencias o resultados de aprendizaje que las y los estudiantes serán capaces de demostrar al finalizar la carrera.\nEs pertinente, se encuentra actualizado según los fundamentos de la profesión docente y es consistente con la denominación del título y grado entregado. Tal perfil, orienta la gestión académica en todas las sedes, jornadas y modalidades en las que se imparte la carrera.", "niveles": {"1": "El perfil de egreso se encuentra formalizado y es difundido a la comunidad.\n\nEl perfil de egreso es coherente con los fundamentos de la profesión y los estándares pedagógicos y disciplinarios para la Formación Inicial Docente vigentes, es consistente con el proyecto institucional y con el modelo educativo de la institución.\n\nEl perfil de egreso orienta la implementación del plan de estudios y es consistente con la denominación del título y grado entregado.", "2": "El perfil de egreso es formulado considerando procesos de validación con actores relevantes, tanto internos como externos a la carrera, y es conocido por sus profesores, estudiantes, empleadores y los centros de práctica.\n\nExiste un procedimiento formalizado que permite el monitoreo del avance en el cumplimiento del perfil de egreso, dentro del cual se consideran los resultados de la Evaluación Nacional Diagnóstica.", "3": "El perfil de egreso es diseñado y validado a través de un proceso sistemático, con la participación de actores relevantes tanto internos como externos, que se enmarca en un sistema de gestión curricular formalizado que considera su evaluación periódica.\n\nLa formulación del perfil de egreso orienta la evaluación del desempeño que alcanzan las y los estudiantes en las distintas áreas de su trayectoria formativa.\n\nLa carrera sistematiza los resultados de inserción laboral y seguimiento de sus titulados, y los incorpora en el proceso de evaluación periódica del perfil de egreso."}}}, {"id": "C2", "numero": 2, "nombre": "Plan de estudios y resultados del proceso formativo", "niveles": [{"numero": 1, "items": [{"id": "C2-N1-01", "texto": "El plan de estudios se enmarca en el modelo educativo institucional.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-02", "texto": "El plan corresponde al nivel educacional para el que forma docentes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-03", "texto": "La estructura curricular explicita su relación con el perfil de egreso.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-04", "texto": "El plan considera estándares pedagógicos y disciplinarios vigentes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-05", "texto": "El plan considera la caracterización del estudiantado.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-06", "texto": "Se establecen objetivos, competencias o resultados de aprendizaje verificables.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-07", "texto": "Existen mecanismos de monitoreo y evaluación del logro del perfil.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-08", "texto": "Los mecanismos permiten evaluar resultados de la Evaluación Nacional Diagnóstica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-09", "texto": "Los mecanismos de admisión son formales, difundidos y consistentes con el plan.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-10", "texto": "Se monitorean indicadores de progresión académica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-11", "texto": "Se identifican aspectos de mejora y acciones asociadas a la progresión.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-12", "texto": "En programas de prosecución, el plan garantiza las competencias del grado y título correspondientes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 2, "items": [{"id": "C2-N2-01", "texto": "Se aplican sistemáticamente políticas y mecanismos de revisión y mejora curricular.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-02", "texto": "La revisión curricular considera resultados de la Evaluación Nacional Diagnóstica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-03", "texto": "Existe consistencia entre resultados de aprendizaje, evaluaciones y actividades formativas.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-04", "texto": "Se analizan sistemáticamente retención, progresión y asignaturas críticas.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-05", "texto": "Se analizan sistemáticamente tiempos de titulación y titulación oportuna.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-06", "texto": "Se definen y ejecutan acciones de mejora a partir de estos análisis.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-07", "texto": "En programas de prosecución se considera la diversidad de origen disciplinar.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-08", "texto": "En programas de prosecución se define y verifica un perfil de ingreso coherente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-09", "texto": "En programas de prosecución existen mecanismos de nivelación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 3, "items": [{"id": "C2-N3-01", "texto": "El plan articula coherentemente sus distintas áreas de formación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-02", "texto": "El plan es consistente con fundamentos, criterios y enfoques del modelo educativo.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-03", "texto": "Las actividades formativas y evaluativas se revisan permanentemente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-04", "texto": "Las actividades se actualizan para alcanzar los resultados de aprendizaje.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-05", "texto": "Las estrategias de enseñanza-aprendizaje articulan docencia e investigación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-06", "texto": "Existen hitos curriculares que observan progresiva e integradamente el logro del perfil.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-07", "texto": "Se evalúan resultados de acciones de mejora de retención y progresión.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-08", "texto": "Se evalúan resultados de acciones de mejora sobre asignaturas críticas y titulación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-09", "texto": "Se toman decisiones basadas en los resultados de dichas acciones.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-10", "texto": "Existe metodología para evaluar el logro del perfil y los resultados formativos.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-11", "texto": "La metodología incorpora opiniones de titulados y contribuye a la mejora continua.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}], "oficial": {"descripcion": "El programa, regular o de prosecución de estudios, en todas sus sedes, jornadas y modalidades, cuenta con un plan de estudios consistente con el modelo educativo institucional y con el perfil de egreso declarado.\nEl plan de estudios considera los Estándares pedagógicos y disciplinarios para la Formación Inicial Docente y la normativa legal vigente.\nLa carrera cuenta con mecanismos que aseguran la efectividad de sus procesos de admisión, enseñanza-aprendizaje y progresión académica, para el logro del perfil de egreso declarado.", "niveles": {"1": "El plan de estudios se enmarca en el modelo educativo y corresponde al nivel educacional para el cual forma docentes.\n\nEl plan de estudios está estructurado en función del perfil de egreso, lo que se explicita en la organización de las actividades curriculares para su logro.\n\nEl plan de estudios considera los estándares pedagógicos y disciplinarios para la Formación Inicial Docente vigentes y la caracterización del estudiantado.\n\nLa carrera establece el logro de objetivos, competencias o resultados de aprendizaje verificables. Cuenta con mecanismos para el monitoreo y evaluación del avance de las y los estudiantes en el logro del perfil de egreso. Dichos mecanismos permiten evalúa los resultados obtenidos por estos en la Evaluación Nacional Diagnóstica.\n\nLa carrera cuenta con mecanismos de admisión formales y difundidos que son consistentes con las exigencias del plan de estudios.\n\nLa carrera monitorea los indicadores de progresión académica de las y los estudiantes, identificando posibles aspectos a mejorar y acciones tendientes a ello.\n\nEl plan de estudios de los programas de prosecución garantiza que el titulado despliega las competencias, objetivos o resultados de aprendizaje correspondientes al grado de licenciado en educación y al título profesional correspondiente.", "2": "La carrera aplica sistemáticamente políticas y mecanismos que permiten la revisión y mejora continua del plan de estudios, los que consideran los resultados de la Evaluación Nacional Diagnóstica.\n\nEl plan de estudios evidencia consistencia entre resultados de aprendizaje, evaluaciones y actividades formativas.\n\nLa carrera realiza un análisis sistemático de retención, progresión, asignaturas críticas, tiempos de titulación y titulación oportuna de las y los estudiantes, definiendo y ejecutando acciones de mejora.\n\nEl plan de estudios de los programas de prosecución considera la diversidad del origen disciplinar de las y los estudiantes y define un perfil de ingreso coherente con este. Verifica el cumplimiento efectivo de este perfil y dispone de mecanismos de nivelación que aseguran su realización.", "3": "El plan de estudios articula un proceso de formación coherente entre sus distintas áreas y es consistente con los fundamentos, criterios y enfoques definidos en el modelo educativo.\n\nLas actividades formativas y evaluativas se encuentran en permanente revisión y se actualizan para el logro de los resultados de aprendizaje.\n\nLas estrategias de enseñanzaaprendizaje que implementan las y los académicos y futuras profesoras y profesores están orientadas por la relación docencia e investigación.\n\nEl diseño curricular contempla hitos que permiten observar de forma progresiva e integrada el logro del perfil de egreso.\n\nLa carrera evalúa los resultados de la implementación de acciones tendientes al mejoramiento de los indicadores de retención, progresión, asignaturas críticas, tiempos de titulación y titulación oportuna de las y los estudiantes y, toma decisiones respecto a los resultados obtenidos.\n\nLa carrera cuenta con una metodología para evaluar el nivel de logro del perfil de egreso declarado y los resultados del proceso formativo, que considera las opiniones de titulados, lo que contribuye a su mejora continua."}}}, {"id": "C3", "numero": 3, "nombre": "Formación práctica", "niveles": [{"numero": 1, "items": [{"id": "C3-N1-01", "texto": "La formación práctica tiene carácter temprano y progresivo explícito.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N1-02", "texto": "Su progresión es consistente con el modelo educativo institucional.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N1-03", "texto": "Existe normativa de práctica que explicita el compromiso con el aprendizaje profesional.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N1-04", "texto": "La normativa establece condiciones de gestión y funciones de los actores.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N1-05", "texto": "La normativa contempla consideraciones éticas del proceso evaluativo.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N1-06", "texto": "Existe un sistema de acompañamiento y seguimiento de la formación práctica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N1-07", "texto": "Existen espacios formales definidos para la supervisión.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N1-08", "texto": "Los profesionales de centros de práctica tienen instancias de coordinación con la universidad.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 2, "items": [{"id": "C3-N2-01", "texto": "Las prácticas consideran desempeños en contextos diversos y pertinentes al título.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N2-02", "texto": "La diversidad cubre niveles educativos, áreas curriculares y contextos institucionales pertinentes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N2-03", "texto": "Los docentes tutores de centros de práctica disponen de articulación y comunicación con la universidad.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N2-04", "texto": "Dicha articulación resguarda la coherencia formativa.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N2-05", "texto": "Dicha articulación favorece capacidades docentes y de acompañamiento de tutores.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 3, "items": [{"id": "C3-N3-01", "texto": "Las actividades en centros de práctica se enfocan en el desempeño del estudiantado.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N3-02", "texto": "Las actividades se evalúan mediante seguimiento para la mejora continua.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N3-03", "texto": "La normativa de práctica considera interlocución permanente entre actores universitarios y escolares.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N3-04", "texto": "La vinculación con el medio logra bidireccionalidad mediante experiencias de formación práctica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}], "oficial": {"descripcion": "La carrera diseña, implementa y monitorea un sistema u organización formal para la formación práctica, que permite a las y los estudiantes desplegar las competencias, objetivos o resultados de aprendizaje del perfil de egreso, y demostrar un desarrollo creciente de su efectividad en la docencia, en el contexto formativo.\nEsta formación es progresiva, y se sustenta en vinculación con las instituciones escolares.", "niveles": {"1": "El carácter temprano y progresivo de la formación práctica es explícito y consistente con el modelo educativo de la institución.\n\nLa carrera cuenta con normativa de práctica que explicita su compromiso con el aprendizaje profesional, condiciones de gestión, las funciones de sus principales actores y las consideraciones éticas del proceso evaluativo.\n\nLa carrera cuenta con un sistema de acompañamiento y seguimiento a la formación práctica que ha definido espacios formales para la supervisión.\n\nLas y los profesionales que apoyan el aprendizaje de las y los estudiantes, desde los centros de práctica, cuentan con instancias de coordinación con la universidad.", "2": "La carrera considera desempeños prácticos en contextos diversos que cubren los distintos niveles educativos, áreas curriculares y contextos institucionales pertinentes al título entregado.\n\nLas y los profesionales docentes (tutoras y tutores) que guían las prácticas en sus respectivos centros, cuentan con instancias de articulación y comunicación con la universidad, que resguardan la coherencia formativa, el desarrollo de sus propias capacidades docentes y de acompañamiento a las y los practicantes.", "3": "Las actividades realizadas por las y los estudiantes en los centros de práctica tienen foco en su desempeño y son evaluadas mediante un sistema de seguimiento para la mejora continua.\n\nEl reglamento o normativa de práctica considera la interlocución permanente entre distintos actores de la institución formadora con distintos actores en las comunidades educativas.\n\nLa vinculación con el medio logra bidireccionalidad, a través de espacios experienciales de formación práctica."}}}, {"id": "C4", "numero": 4, "nombre": "Cuerpo académico", "niveles": [{"numero": 1, "items": [{"id": "C4-N1-01", "texto": "La dotación académica permite atender las necesidades formativas de la carrera.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N1-02", "texto": "Existen políticas y normas para ingreso y evaluación periódica del cuerpo académico.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N1-03", "texto": "Estas normas resguardan idoneidad disciplinar, profesional y pedagógica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N1-04", "texto": "Existen instancias para transmitir el modelo educativo y sello institucional.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N1-05", "texto": "El cuerpo académico participa en instancias de análisis de sus prácticas docentes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N1-06", "texto": "Estas instancias estimulan la reflexión crítica de estudiantes sobre su futuro desempeño docente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 2, "items": [{"id": "C4-N2-01", "texto": "Existen instancias permanentes de evaluación de dotación, estabilidad y dedicación académica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N2-02", "texto": "Se evalúa el desarrollo de la carrera académica para mejorar sus indicadores.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N2-03", "texto": "Se realizan sistemáticamente actividades de desarrollo docente y disciplinar.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N2-04", "texto": "Hay académicos con experiencia en el sistema escolar.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N2-05", "texto": "Existen instancias de coordinación que articulan formación teórica y práctica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N2-06", "texto": "Se aplican formal y sistemáticamente normas de evaluación, jerarquización y carrera académica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N2-07", "texto": "Se promueven estudios e investigación disciplinar y pedagógica relevantes para formación inicial docente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 3, "items": [{"id": "C4-N3-01", "texto": "El desarrollo disciplinar y pedagógico del cuerpo académico incide en la mejora continua de la formación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N3-02", "texto": "La vinculación con el medio se considera en la evaluación académica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N3-03", "texto": "La vinculación con el medio retroalimenta el currículo.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N3-04", "texto": "Se identifican oportunidades del entorno para desarrollar la carrera.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N3-05", "texto": "Los resultados de investigación aportan a la docencia y generación de conocimiento.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N3-06", "texto": "Los resultados aportan a creación e innovación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N3-07", "texto": "Los resultados se difunden entre comunidades académicas y el sistema escolar.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}], "oficial": {"descripcion": "El cuerpo académico cuenta con la dedicación y credenciales académicas y profesionales para el desarrollo del proceso de enseñanza - aprendizaje y la implementación del plan de estudios.\nLos académicos desarrollan acciones de investigación o innovación sobre la experiencia docente, que impactan en el proceso formativo, tanto en lo disciplinar como en lo pedagógico.", "niveles": {"1": "Existen políticas y normas para el ingreso y la evaluación periódica a dicho cuerpo, para garantizar idoneidad disciplinar, profesional y pedagógica.\n\nExisten instancias de formación para transmitir el modelo educativo y el sello institucional a las y los profesores.\n\nEl cuerpo académico participa de instancias que les permiten analizar sus prácticas docentes, estimulando la reflexión crítica en las y los estudiantes para su futuro desempeño docente.", "2": "Se realizan sistemáticamente actividades de desarrollo docente y disciplinar.\n\nEl cuerpo académico cuenta con miembros con experiencia en el sistema escolar y, con las instancias de coordinación, que aseguran la coherencia formativa y articulación entre la formación teórica y práctica.\n\nLa carrera aplica de manera formal y sistemática las normas institucionales que regulan la evaluación, jerarquización y carrera de su cuerpo académico.\n\nSe promueve el desarrollo de estudios o investigación disciplinar y pedagógica relevantes para la formación inicial de profesores.", "3": "La vinculación con el medio es considerada en la evaluación académica y, al mismo tiempo, entrega oportunidades para la retroalimentación del currículo. Se identifican oportunidades en el entorno para el desarrollo de la carrera.\n\nLos resultados de la investigación aportan a la docencia, a la generación de conocimientos y a la creación e innovación, los que son difundidos entre las comunidades académicas y el sistema escolar."}}}]}, {"id": "DII", "nombre": "Gestión estratégica y recursos institucionales", "criterios": [{"id": "C5", "numero": 5, "nombre": "Gobierno y gestión de recursos", "niveles": [{"numero": 1, "items": [{"id": "C5-N1-01", "texto": "Existe instancia directiva con dedicación y atribuciones para gestionar la docencia.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-02", "texto": "La dirección vela por implementar el plan y cumplir requerimientos normativos.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-03", "texto": "Existe personal administrativo, técnico y de apoyo suficiente y capacitado.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-04", "texto": "Existe un plan de gestión con objetivos o metas de desarrollo.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-05", "texto": "Los estudiantes reciben información clara y oportuna sobre servicios.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-06", "texto": "Existe comité académico o núcleo docente que coordina actividades y condiciones de operación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-07", "texto": "El comité o núcleo considera la opinión estudiantil.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-08", "texto": "Existen instalaciones adecuadas a los requerimientos particulares de la carrera.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-09", "texto": "Existen mecanismos de planificación, adquisición y mantención de recursos materiales y tecnológicos.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-10", "texto": "Las condiciones se consideran en las sedes, modalidades y jornadas correspondientes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 2, "items": [{"id": "C5-N2-01", "texto": "Se evalúa la implementación de planes de mejora y gestión.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N2-02", "texto": "Los planes se ajustan según los resultados de su evaluación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N2-03", "texto": "La coordinación entre unidades que implementan el plan opera sistemáticamente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N2-04", "texto": "Los mecanismos de adquisición, mantención, actualización y desarrollo de recursos operan transversal y sistemáticamente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N2-05", "texto": "Estos mecanismos consideran requerimientos particulares de la carrera.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N2-06", "texto": "Existen mecanismos formalizados de atención de solicitudes, inquietudes y necesidades estudiantiles.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N2-07", "texto": "Existen recursos formativos actualizados para las sedes y modalidades correspondientes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 3, "items": [{"id": "C5-N3-01", "texto": "La carrera utiliza información sobre logro de objetivos y metas para mejorar continuamente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N3-02", "texto": "La gestión de instalaciones y equipamiento sigue políticas de vigencia tecnológica y operativa.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N3-03", "texto": "La gestión considera seguimiento de satisfacción de usuarios.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}], "oficial": {"descripcion": "La unidad académica a la que se adscribe la carrera cuenta con un sistema de administración que define una estructura para la coordinación y para la toma de decisiones.\nSe dispone de políticas y mecanismos para la gestión administrativa de los recursos económicos, materiales y tecnológicos y con las instalaciones necesarias para el desarrollo de sus actividades.", "niveles": {"1": "La carrera cuenta con personal administrativo, técnico y de apoyo necesario y capacitado para cumplir sus funciones.\n\nLa carrera cuenta con un plan de gestión que establece objetivos o metas para su desarrollo.\n\nLas y los estudiantes disponen de información clara y oportuna sobre los servicios ofrecidos.\n\nLa carrera cuenta con un comité académico o núcleo docente que posibilita la coordinación efectiva de todas las actividades y condiciones de operación necesarias para garantizar el logro del odo el quehacer orientado al mejoramiento continuo.", "3": "La carrera demuestra que implementa y monitorea las acciones comprometidas en sus planes de mejoramiento o de desarrollo y, los recursos asociados están debidamente asegurados tanto en su formulación como en su proyección.\n\nLa carrera cumple consistentemente las metas establecidas en los sucesivos planes de mejora, demostrando resultados coherentes con las políticas institucionales. En función de estos resultados, realiza ajustes para lograr una formación de calidad."}}}]}], "estados_permitidos": ["sin_evaluar", "cumple", "parcial", "no_cumple", "no_aplica"], "tipos_observacion": ["tarea", "fortaleza", "oportunidad_de_mejora"]};
const STORAGE='asistente_autoevaluacion_proyecto_v1';
let project=null,section='inicio',criterionId='C1',criterionTab='norma',invFilter='todos';
const $=id=>document.getElementById(id);
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9));
const today=()=>new Date().toISOString().slice(0,10);
const names={institucional:'Institucional',mecanismo:'Mecanismo',antecedente:'Antecedente'};

const stageLabel={no_atendida:'No atendida',en_atencion:'En atención',atendida:'Atendida'};
function allCriteria(){return project.catalogo.dimensiones.flatMap(d=>d.criterios)}
function getCriterion(id){return allCriteria().find(c=>c.id===id)}
function allItems(c){return c.niveles.flatMap(l=>l.items)}
function blankProject(name){return {schema:'asistente-autoevaluacion',version:1,id:uid(),nombre:name,creado:today(),catalogo:clone(TEMPLATE),inventario:[],jornadas:[],juicios:[],acciones:[],observaciones:[],analisis:{}}}
function save(){if(!project)return;try{localStorage.setItem(STORAGE,JSON.stringify(project));$('saveLabel').textContent='Guardado local · '+new Date().toLocaleTimeString('es-CL')}catch(e){$('saveLabel').textContent='⚠ Almacenamiento lleno: exporta JSON';alert('No se pudo guardar localmente. Exporta el JSON para evitar pérdidas.')} }
function commit(){save();render()}
function modal(html){$('modal').innerHTML=html;$('modal').showModal()}
function closeModal(){$('modal').close()}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${esc(label)}</label>${type==='textarea'?`<textarea name="${name}" ${extra}>${esc(value)}</textarea>`:`<input type="${type}" name="${name}" value="${esc(value)}" ${extra}>`}</div>`}
function sel(label,name,options,value){return `<div class="field"><label>${esc(label)}</label><select name="${name}">${options.map(([v,t])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`}
function formData(f){return Object.fromEntries(new FormData(f).entries())}
function choices(criteriaIds){return allCriteria().map(c=>`<label class="row tiny"><input type="checkbox" name="criterios" value="${c.id}" ${criteriaIds.includes(c.id)?'checked':''}>${esc(c.numero+'. '+c.nombre)}</label>`).join('')}
function chosen(f){return [...f.querySelectorAll('input[name="criterios"]:checked')].map(x=>x.value)}
function chips(ids){return (ids||[]).map(id=>{const c=getCriterion(id);return c?`<span class="pill">${esc(c.numero+'. '+c.nombre)}</span>`:''}).join('')}
function refsBlock(refs){return (refs||[]).map(s=>{let url=s.url||'';let safe=/^https?:\/\//i.test(url);return `<div class="row tiny">📎 ${safe?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(s.nombre||url)}</a>`:esc(s.nombre||'Fuente')} ${!safe&&url?`<span class="muted">${esc(url)}</span>`:''}</div>`}).join('')}
function sourceFields(refs){return `<div id="sourceRows">${(refs||[]).map((r,i)=>sourceRow(r,i)).join('')}</div><button type="button" onclick="addSource()">+ Añadir fuente</button>`}
function sourceRow(r={},i=0){return `<div class="row" style="margin:7px 0"><input style="flex:1;min-width:140px" placeholder="Nombre de fuente" class="srcname" value="${esc(r.nombre||'')}"><input style="flex:2;min-width:150px" placeholder="https://... o referencia documental" class="srcurl" value="${esc(r.url||'')}"><button type="button" onclick="this.parentElement.remove()">×</button></div>`}
function addSource(){$('sourceRows').insertAdjacentHTML('beforeend',sourceRow())}
function sourcesFrom(f){return [...f.querySelectorAll('#sourceRows .row')].map(row=>({nombre:row.querySelector('.srcname').value.trim(),url:row.querySelector('.srcurl').value.trim()})).filter(x=>x.nombre||x.url)}
function linkInventario(ids){return (ids||[]).map(id=>{let r=project.inventario.find(x=>x.id===id);return r?`<button onclick="editInventory('${id}')">${esc(r.nombre)}</button>`:''}).join(' ')}
function navTo(s){section=s;render()}
function openCriterion(id,tab='norma'){criterionId=id;criterionTab=tab;section='criterios';render()}
function render(){if(!project){renderWelcome();return}
$('projectLabel').textContent='· '+project.nombre;
let nav=[['inicio','Panel general'],['jornadas','Ejercicios'],['inventario','Inventario'],['juicios','Juicios preliminares'],['criterios','Criterios CNA'],['seguimiento','Seguimiento']];
$('nav').innerHTML=nav.map(([id,t])=>`<button class="${section===id?'active':''}" onclick="navTo('${id}')">${t}</button>`).join('');
$('app').innerHTML=({inicio:renderHome,jornadas:renderSessions,inventario:renderInventory,juicios:renderJudgments,criterios:renderCriteria,seguimiento:renderFollowup}[section]||renderHome)()}
function renderWelcome(){$('nav').innerHTML='';$('projectLabel').textContent='';$('app').innerHTML=`<div class="panel" style="max-width:680px;margin:60px auto"><h1>Bienvenido a Asistente Autoevaluación</h1><p>Comienza un proyecto nuevo o importa uno guardado en JSON. Incluye los seis criterios CNA, sus tres niveles y 131 ítems editables.</p><form onsubmit="createProject(event)">${field('Nombre del proyecto','nombre','','text','required placeholder="Ej. Autoevaluación Pedagogía en Castellano 2027"')}<button class="primary" type="submit">Crear proyecto</button> <button type="button" onclick="$('fileInput').click()">Importar proyecto JSON</button></form><p class="muted tiny">Los cambios se guardan en este navegador. Exporta copias JSON periódicamente: el almacenamiento local no es una copia de seguridad.</p></div>`}
function createProject(e){e.preventDefault();let name=e.target.elements.nombre.value.trim();if(!name)return;project=blankProject(name);section='inicio';commit()}
function projectSettings(){modal(`<h2>Proyecto</h2><form onsubmit="renameProject(event)">${field('Nombre del proyecto','nombre',project.nombre,'text','required')}<button class="primary">Guardar nombre</button> <button type="button" onclick="closeModal()">Cancelar</button></form><hr><button onclick="exportJSON()">Exportar copia JSON</button><p class="muted tiny">Crear un proyecto nuevo reemplazará el proyecto abierto en este navegador. Exporta primero tu copia.</p><button class="danger" onclick="newProject()">Crear otro proyecto</button>`)}
function renameProject(e){e.preventDefault();project.nombre=e.target.elements.nombre.value.trim();closeModal();commit()}
function newProject(){if(!confirm('¿Crear otro proyecto? Exporta antes el proyecto actual.'))return;project=null;localStorage.removeItem(STORAGE);closeModal();render()}
function exportJSON(){if(!project)return;const blob=new Blob([JSON.stringify(project,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Asistente_Autoevaluacion_'+project.nombre.replace(/[^a-z0-9áéíóúñ_-]+/gi,'_')+'_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importJSON(e){const f=e.target.files[0];e.target.value='';if(!f)return;try{const p=JSON.parse(await f.text());if(p.schema!=='asistente-autoevaluacion'||!p.nombre||!p.catalogo?.dimensiones||!Array.isArray(p.inventario)||!Array.isArray(p.juicios)||!Array.isArray(p.acciones)||!Array.isArray(p.jornadas)||!Array.isArray(p.observaciones))throw Error('Estructura de proyecto no compatible');if(project&&!confirm('Se reemplazará el proyecto abierto. ¿Ya exportaste una copia?'))return;project=p;project.analisis ||= {};section='inicio';commit();alert('Proyecto importado correctamente.')}catch(err){alert('No se pudo importar: '+err.message)}}
function renderHome(){let cs=allCriteria(),items=cs.flatMap(allItems),evaluated=items.filter(x=>x.estado!=='sin_evaluar').length;return `<h1>Panel general</h1><p class="muted">${esc(project.nombre)} · Proyecto creado el ${esc(project.creado)}</p><div class="grid">${[['Criterios CNA',cs.length],['Ítems evaluados',evaluated+' / '+items.length],['Registros de inventario',project.inventario.length],['Juicios preliminares',project.juicios.length],['Acciones',project.acciones.length],['Jornadas',project.jornadas.length]].map(([t,v])=>`<div class="panel"><div class="metric">${v}</div><div class="muted">${t}</div></div>`).join('')}</div><div class="panel"><h2>Avance por criterio</h2>${cs.map(c=>{let arr=allItems(c),n=arr.filter(i=>i.estado!=='sin_evaluar').length;return `<div class="item"><div class="row between"><button onclick="openCriterion('${c.id}','verificacion')">${esc(c.numero+'. '+c.nombre)}</button><span class="muted">${n}/${arr.length} evaluados</span></div><div class="bar"><span style="width:${100*n/arr.length}%;background:#3e8eaa"></span></div></div>`}).join('')}</div><div class="notice">El avance indica ítems evaluados, no cumplimiento CNA. El nivel global se determina mediante un juicio fundamentado.</div>`}
function renderInventory(){let list=project.inventario.filter(x=>invFilter==='todos'||x.tipo===invFilter);return `<div class="row between"><div><h1>Inventario consolidado</h1><p class="muted">Registros únicos, reutilizables en varios criterios y exigencias.</p></div><button class="primary" onclick="editInventory()">+ Nuevo registro</button></div><div class="panel"><div class="row">${sel('Filtrar categoría','filter',[['todos','Todas'],...Object.entries(names)],invFilter).replace('<select ','<select onchange="invFilter=this.value;render()" ')}</div>${list.length?list.map(r=>`<div class="item"><div class="row between"><h3>${esc(r.nombre)} <span class="pill">${names[r.tipo]}</span></h3><button onclick="editInventory('${r.id}')">Editar</button></div><div class="muted tiny">${esc(r.fecha||'Sin fecha')} · ${chips(r.criterios)}</div><p>${esc(r.descripcion||'')}</p>${refsBlock(r.fuentes)}${r.tipo==='antecedente'&&r.relaciones?.length?`<p class="tiny">Asociado a: ${linkInventario(r.relaciones)}</p>`:''}</div>`).join(''):'<p class="muted">No hay registros en esta categoría.</p>'}</div>`}
function editInventory(id){let r=project.inventario.find(x=>x.id===id)||{tipo:'institucional',nombre:'',fecha:'',descripcion:'',fuentes:[],criterios:section==='criterios'?[criterionId]:[],relaciones:[]};modal(`<h2>${id?'Editar':'Nuevo'} registro de inventario</h2><form onsubmit="saveInventory(event,'${id||''}')">${sel('Categoría','tipo',Object.entries(names),r.tipo)}${field('Nombre','nombre',r.nombre,'text','required')}${field('Fecha o año','fecha',r.fecha,'text','placeholder="2026 o 21-10-2026"')}${field('Descripción','descripcion',r.descripcion,'textarea')}<h3>Fuentes (pueden ser varias)</h3>${sourceFields(r.fuentes)}<h3>Criterios asociados</h3><div class="grid">${choices(r.criterios||[])}</div><h3>Antecedentes vinculados a políticas o mecanismos</h3><div class="field"><label>Selecciona registros institucionales o mecanismos relacionados</label><div class="grid">${project.inventario.filter(x=>x.id!==id&&x.tipo!=='antecedente').map(x=>`<label class="tiny row"><input type="checkbox" name="relaciones" value="${x.id}" ${(r.relaciones||[]).includes(x.id)?'checked':''}>${esc(x.nombre)}</label>`).join('')||'<span class="muted">No hay otros registros.</span>'}</div></div><div class="row"><button class="primary">Guardar registro</button><button type="button" onclick="closeModal()">Cancelar</button>${id?`<button class="danger" type="button" onclick="deleteInventory('${id}')">Eliminar</button>`:''}</div></form>`)}
function saveInventory(e,id){e.preventDefault();let f=e.target,d=formData(f),r=project.inventario.find(x=>x.id===id);if(!r){r={id:uid()};project.inventario.push(r)}Object.assign(r,{tipo:d.tipo,nombre:d.nombre.trim(),fecha:d.fecha,descripcion:d.descripcion,fuentes:sourcesFrom(f),criterios:chosen(f),relaciones:[...f.querySelectorAll('input[name=relaciones]:checked')].map(x=>x.value)});closeModal();commit()}
function deleteInventory(id){if(!confirm('Eliminar este registro del inventario y desvincularlo de las verificaciones?'))return;project.inventario=project.inventario.filter(x=>x.id!==id);for(let c of allCriteria())for(let i of allItems(c))i.inventario_ids=(i.inventario_ids||[]).filter(x=>x!==id);for(let r of project.inventario)r.relaciones=(r.relaciones||[]).filter(x=>x!==id);closeModal();commit()}
function renderSessions(){return `<div class="row between"><div><h1>Ejercicios de autoevaluación</h1><p class="muted">Cada jornada registra su acta, participantes y juicios preliminares.</p></div><button class="primary" onclick="editSession()">+ Nueva jornada</button></div><div class="panel">${project.jornadas.length?project.jornadas.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(s=>`<div class="item"><div class="row between"><h3>${esc(s.nombre)}</h3><button onclick="editSession('${s.id}')">Editar jornada</button></div><p class="muted">${esc(s.fecha)} · Profesores: ${s.profesores||0} · Estudiantes: ${s.estudiantes||0} · Externos: ${s.externos||0}</p><p>${esc(s.temas||'')}</p>${refsBlock(s.acta?[{nombre:'Acta',url:s.acta}]:[])}<p>${project.juicios.filter(j=>j.jornada_id===s.id).length} juicios vinculados</p><button onclick="editJudgment('','${s.id}')">+ Añadir juicio preliminar</button></div>`).join(''):'<p class="muted">Aún no se han registrado jornadas.</p>'}</div>`}
function editSession(id){let s=project.jornadas.find(x=>x.id===id)||{nombre:'',fecha:today(),temas:'',acta:'',profesores:0,estudiantes:0,externos:0};modal(`<h2>${id?'Editar':'Nueva'} jornada</h2><form onsubmit="saveSession(event,'${id||''}')">${field('Nombre de la instancia','nombre',s.nombre,'text','required')}${field('Fecha','fecha',s.fecha,'date','required')}${field('Temas abordados','temas',s.temas,'textarea')}${field('Acta (enlace o referencia)','acta',s.acta)}<div class="grid">${field('Profesores','profesores',s.profesores,'number','min="0"')}${field('Estudiantes','estudiantes',s.estudiantes,'number','min="0"')}${field('Externos','externos',s.externos,'number','min="0"')}</div><button class="primary">Guardar</button> <button type="button" onclick="closeModal()">Cancelar</button></form>`)}
function saveSession(e,id){e.preventDefault();let d=formData(e.target),s=project.jornadas.find(x=>x.id===id);if(!s){s={id:uid()};project.jornadas.push(s)}Object.assign(s,d);closeModal();commit()}
function stageBadge(j){return j.categoria==='oportunidad'?`<span class="pill ${j.estado==='atendida'?'atendida':j.estado==='en_atencion'?'atencion':'noatendida'}">${stageLabel[j.estado]||'No atendida'}</span>`:''}
function judgmentCard(j){let s=project.jornadas.find(x=>x.id===j.jornada_id);return `<div class="item"><div class="row between"><span class="pill ${j.categoria}">${catLabel[j.categoria]}</span>${stageBadge(j)}<button onclick="editJudgment('${j.id}')">Editar / seguimiento</button></div><p>${esc(j.texto)}</p><p class="muted tiny">${esc(j.fecha)} · Fuente: ${esc(s?.nombre||j.fuente||'Sin instancia')} · ${chips(j.criterios)}</p>${(j.historial||[]).length?`<details><summary>Historial (${j.historial.length})</summary>${j.historial.map(h=>`<p class="tiny">${esc(h.fecha)} — ${esc(h.texto)}</p>`).join('')}</details>`:''}<div class="tiny">Acciones: ${project.acciones.filter(a=>(a.juicio_ids||[]).includes(j.id)).map(a=>`<button onclick="editAction('${a.id}')">${esc(a.nombre)} · ${esc(a.estado)}</button>`).join(' ')||'Ninguna'}</div><button onclick="editAction('','${j.id}')">+ Vincular nueva acción</button></div>`}
function renderJudgments(){return `<div class="row between"><div><h1>Juicios evaluativos preliminares</h1><p class="muted">Valoraciones originadas en jornadas; no equivalen a juicios formales CNA.</p></div><button class="primary" onclick="editJudgment()">+ Nuevo juicio</button></div><div class="panel">${project.juicios.length?project.juicios.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(judgmentCard).join(''):'<p class="muted">No hay juicios registrados.</p>'}</div>`}
function editJudgment(id,sessionId=''){let j=project.juicios.find(x=>x.id===id)||{texto:'',fecha:today(),jornada_id:sessionId,categoria:'neutral',estado:'no_atendida',criterios:section==='criterios'?[criterionId]:[],historial:[]};modal(`<h2>${id?'Editar':'Nuevo'} juicio preliminar</h2><form onsubmit="saveJudgment(event,'${id||''}')">${field('Contenido del juicio','texto',j.texto,'textarea','required')}${field('Fecha','fecha',j.fecha,'date')}${sel('Categoría','categoria',[['neutral','Neutral'],['fortaleza','Fortaleza'],['oportunidad','Oportunidad de mejora']],j.categoria)}${sel('Estado de atención (si es oportunidad)','estado',Object.entries(stageLabel),j.estado)}${sel('Instancia de origen','jornada_id',[['','Sin jornada registrada'],...project.jornadas.map(s=>[s.id,s.nombre])],j.jornada_id)}${field('Fuente / nombre de instancia si no está registrada','fuente',j.fuente||'')}<h3>Criterios asociados</h3><div class="grid">${choices(j.criterios||[])}</div><div class="row"><button class="primary">Guardar</button><button type="button" onclick="closeModal()">Cancelar</button></div></form>${id?`<hr><h3>Añadir actualización al historial</h3><form onsubmit="addHistory(event,'${id}')">${field('Fecha','fecha',today(),'date')}${field('Actualización','texto','','textarea','required')}<button>Agregar actualización</button></form><h3>Historial</h3>${(j.historial||[]).map(h=>`<p>${esc(h.fecha)} · ${esc(h.texto)}</p>`).join('')}`:''}`)}
function saveJudgment(e,id){e.preventDefault();let d=formData(e.target),j=project.juicios.find(x=>x.id===id);if(!j){j={id:uid(),historial:[]};project.juicios.push(j)}Object.assign(j,d,{criterios:chosen(e.target)});closeModal();commit()}
function addHistory(e,id){e.preventDefault();let j=project.juicios.find(x=>x.id===id);j.historial.push(formData(e.target));closeModal();commit()}
function renderCriteria(){let c=getCriterion(criterionId)||allCriteria()[0];let tabs=[['norma','1. Criterio CNA'],['inventario','2. Inventario'],['juicios','3. Juicios preliminares'],['verificacion','4. Verificación'],['analisis','5. Análisis consolidado']];return `<div class="split"><aside class="panel"><h2>Dimensiones y criterios</h2>${project.catalogo.dimensiones.map(d=>`<h3>${esc(d.id)}. ${esc(d.nombre)}</h3>${d.criterios.map(x=>`<button class="cardbtn ${c.id===x.id?'primary':''}" onclick="openCriterion('${x.id}',criterionTab)">${esc(x.numero+'. '+x.nombre)}</button>`).join('')}`).join('')}</aside><div><div class="panel"><p class="muted tiny">CRITERIO ${c.numero}</p><h1>${esc(c.nombre)}</h1><div class="tabs">${tabs.map(([id,t])=>`<button class="${criterionTab===id?'active':''}" onclick="criterionTab='${id}';render()">${t}</button>`).join('')}</div>${({norma:tabNorma,inventario:tabInventory,juicios:tabJudgments,verificacion:tabCheck,analisis:tabAnalysis}[criterionTab]||tabNorma)(c)}</div></div></div>`}
function tabNorma(c){return `<div class="notice">Texto de referencia oficial CNA, separado de los ítems operativos editables.</div><h2>Descripción del criterio</h2><p style="white-space:pre-line">${esc(c.oficial.descripcion)}</p>${[1,2,3].map(n=>`<details class="level" open><summary>Nivel ${n}</summary><div style="padding:15px;white-space:pre-line;line-height:1.65">${esc(c.oficial.niveles[n])}</div></details>`).join('')}`}
function tabInventory(c){let arr=project.inventario.filter(r=>(r.criterios||[]).includes(c.id));return `<div class="row between"><h2>Inventario asociado</h2><button onclick="editInventory()">+ Crear registro</button></div>${Object.entries(names).map(([type,label])=>`<h3>${label}</h3>${arr.filter(x=>x.tipo===type).map(r=>`<div class="item"><button onclick="editInventory('${r.id}')">${esc(r.nombre)}</button> <span class="muted">${esc(r.fecha)}</span><p>${esc(r.descripcion||'')}</p>${refsBlock(r.fuentes)}${r.relaciones?.length?`<p class="tiny">Relaciones: ${linkInventario(r.relaciones)}</p>`:''}</div>`).join('')||'<p class="muted">Sin registros asociados.</p>'}`).join('')}<p class="muted tiny">Puedes vincular este criterio al crear o editar registros del inventario.</p>`}
function tabJudgments(c){let arr=project.juicios.filter(j=>(j.criterios||[]).includes(c.id));return `<div class="row between"><h2>Juicios preliminares asociados</h2><button onclick="editJudgment()">+ Nuevo juicio</button></div>${arr.map(judgmentCard).join('')||'<p class="muted">Sin juicios vinculados a este criterio.</p>'}`}
function progress(items){let counts={cumple:0,parcial:0,no_cumple:0,sin_evaluar:0,no_aplica:0};items.forEach(i=>counts[i.estado||'sin_evaluar']++);return `<div class="row between tiny"><span>${counts.cumple} cumple · ${counts.parcial} parcial · ${counts.no_cumple} no cumple · ${counts.sin_evaluar} sin evaluar · ${counts.no_aplica} no aplica</span></div><div class="bar">${[['cumple','#328e6c'],['parcial','#e3aa42'],['no_cumple','#d35b61'],['no_aplica','#a9b3c0']].map(([k,color])=>`<span style="width:${100*counts[k]/Math.max(items.length,1)}%;background:${color}"></span>`).join('')}</div>`}
function tabCheck(c){return `<h2>Lista de verificación editable</h2><p class="muted">Selecciona una exigencia para evaluar, fundamentar, asociar registros del inventario y declarar observaciones.</p>${c.niveles.map(l=>`<details class="level" open><summary>Nivel ${l.numero} · ${l.items.length} exigencias</summary><div style="padding:12px">${progress(l.items)}${l.items.map(i=>`<div class="item"><div class="row between"><span class="muted tiny">${esc(i.id)}</span><span class="pill">${stateLabel[i.estado]||'Sin evaluar'}</span></div><p>${esc(i.texto)}</p>${i.fundamentacion?`<p class="muted tiny">${esc(i.fundamentacion)}</p>`:''}<div class="row">${linkInventario(i.inventario_ids)}<button onclick="editCheck('${c.id}',${l.numero},'${i.id}')">Evaluar / editar</button></div>${project.observaciones.filter(o=>o.item_id===i.id).map(o=>`<span class="pill ${o.tipo}">${catLabel[o.tipo]}</span>`).join(' ')}</div>`).join('')}<button onclick="addCheck('${c.id}',${l.numero})">+ Añadir ítem al nivel ${l.numero}</button></div></details>`).join('')}`}
function editCheck(cid,n,id){let c=getCriterion(cid),l=c.niveles.find(x=>x.numero===n),i=l.items.find(x=>x.id===id);modal(`<h2>Evaluar exigencia ${esc(id)}</h2><form onsubmit="saveCheck(event,'${cid}',${n},'${id}')">${field('Texto del ítem (editable)','texto',i.texto,'textarea','required')}${sel('Estado de cumplimiento','estado',Object.entries(stateLabel),i.estado)}${field('Fundamentación','fundamentacion',i.fundamentacion||'','textarea')}<h3>Asociar elementos del inventario</h3><div class="grid">${project.inventario.map(r=>`<label class="tiny row"><input type="checkbox" name="inventario" value="${r.id}" ${(i.inventario_ids||[]).includes(r.id)?'checked':''}>${esc(r.nombre)} (${names[r.tipo]})</label>`).join('')||'<p class="muted">Sin registros. Créalo desde Inventario.</p>'}</div><div class="row"><button class="primary">Guardar evaluación</button><button type="button" onclick="closeModal()">Cancelar</button><button type="button" class="danger" onclick="archiveCheck('${cid}',${n},'${id}')">Archivar ítem</button></div></form><hr><h3>Observaciones de este ítem</h3>${project.observaciones.filter(o=>o.item_id===id).map(o=>`<div class="item"><span class="pill ${o.tipo}">${catLabel[o.tipo]}</span> ${esc(o.texto)} <button onclick="editObservation('${o.id}')">Editar</button></div>`).join('')||'<p class="muted">Sin observaciones.</p>'}<button onclick="editObservation('','${cid}','${id}')">+ Añadir observación</button>`)}
function saveCheck(e,cid,n,id){e.preventDefault();let i=getCriterion(cid).niveles.find(x=>x.numero===n).items.find(x=>x.id===id),d=formData(e.target);Object.assign(i,{texto:d.texto,estado:d.estado,fundamentacion:d.fundamentacion,inventario_ids:[...e.target.querySelectorAll('input[name=inventario]:checked')].map(x=>x.value)});closeModal();commit()}
function archiveCheck(cid,n,id){if(!confirm('¿Archivar el ítem? Se ocultará de la verificación activa, pero se conservarán sus datos.'))return;let l=getCriterion(cid).niveles.find(x=>x.numero===n),i=l.items.find(x=>x.id===id);l.archivados||=[];l.archivados.push(i);l.items=l.items.filter(x=>x.id!==id);closeModal();commit()}
function addCheck(cid,n){modal(`<h2>Nuevo ítem · Nivel ${n}</h2><form onsubmit="saveNewCheck(event,'${cid}',${n})">${field('Exigencia verificable','texto','','textarea','required')}<button class="primary">Añadir</button></form>`)}
function saveNewCheck(e,cid,n){e.preventDefault();let l=getCriterion(cid).niveles.find(x=>x.numero===n),id=cid+'-N'+n+'-USR-'+uid();l.items.push({id,texto:e.target.elements.texto.value,estado:'sin_evaluar',fundamentacion:'',inventario_ids:[],observaciones:[],editable:true});closeModal();commit()}
function editObservation(id,cid='',itemId=''){let o=project.observaciones.find(x=>x.id===id)||{criterio_id:cid||criterionId,item_id:itemId,tipo:'tarea',texto:'',fecha:today(),estado:'pendiente'};modal(`<h2>${id?'Editar':'Nueva'} observación</h2><form onsubmit="saveObservation(event,'${id||''}')">${sel('Tipo','tipo',[['tarea','Tarea'],['fortaleza','Fortaleza'],['oportunidad','Oportunidad de mejora']],o.tipo)}${field('Observación','texto',o.texto,'textarea','required')}${field('Fecha','fecha',o.fecha,'date')}${sel('Estado de seguimiento','estado',[['pendiente','Pendiente'],['proyectada','Proyectada'],['diseno','En diseño'],['ejecucion_inicial','En ejecución inicial'],['ejecucion','En ejecución'],['completada','Completada']],o.estado)}<button class="primary">Guardar</button></form>`)}
function saveObservation(e,id){e.preventDefault();let o=project.observaciones.find(x=>x.id===id);if(!o){o={id:uid(),criterio_id:criterionId,item_id:window._unused||'',historial:[]};let m=$('modal').dataset; o.criterio_id=m.criterion||criterionId;o.item_id=m.item||'';project.observaciones.push(o)}Object.assign(o,formData(e.target));closeModal();commit()}
function tabAnalysis(c){let a=project.analisis[c.id]||{},obs=project.observaciones.filter(o=>o.criterio_id===c.id);return `<h2>Análisis consolidado</h2><div class="notice">Las observaciones creadas desde la lista de verificación se muestran automáticamente aquí, con su ítem de origen.</div>${[['fortaleza','Fortalezas'],['oportunidad','Oportunidades de mejora'],['tarea','Tareas']].map(([type,label])=>`<h3>${label} (${obs.filter(o=>o.tipo===type).length})</h3>${obs.filter(o=>o.tipo===type).map(o=>`<div class="item"><span class="pill ${type}">${catLabel[type]}</span> ${esc(o.texto)} <span class="muted tiny">· ${esc(o.item_id)} · ${esc(o.estado)}</span> <button onclick="editObservation('${o.id}')">Editar</button></div>`).join('')||'<p class="muted">Sin observaciones de esta categoría.</p>'}`).join('')}<hr><h3>Redacción progresiva del análisis</h3><form onsubmit="saveAnalysis(event,'${c.id}')">${field('Síntesis de situación actual','situacion',a.situacion||'','textarea')}${field('Fortalezas y debilidades','balance',a.balance||'','textarea')}${field('Evaluación global y fundamentación del nivel','juicio',a.juicio||'','textarea')}${sel('Nivel estimado','nivel',[['','Sin determinar'],['1','Nivel 1'],['2','Nivel 2'],['3','Nivel 3']],a.nivel||'')}${field('Proyecciones de mejoramiento','proyecciones',a.proyecciones||'','textarea')}${sel('Estado del análisis','estado',[['borrador','Borrador'],['validado','Validado']],a.estado||'borrador')}<button class="primary">Guardar análisis</button></form>`}
function saveAnalysis(e,id){e.preventDefault();project.analisis[id]=formData(e.target);commit()}
function editAction(id,judgmentId=''){let a=project.acciones.find(x=>x.id===id)||{nombre:'',descripcion:'',estado:'proyectada',responsable:'',fecha:today(),juicio_ids:judgmentId?[judgmentId]:[],criterios:section==='criterios'?[criterionId]:[],historial:[]};modal(`<h2>${id?'Editar':'Nueva'} acción</h2><form onsubmit="saveAction(event,'${id||''}')">${field('Nombre','nombre',a.nombre,'text','required')}${field('Descripción','descripcion',a.descripcion,'textarea')}${field('Fecha','fecha',a.fecha,'date')}${field('Responsable','responsable',a.responsable)}${sel('Estado','estado',[['proyectada','Proyectada'],['diseno','En diseño'],['ejecucion_inicial','Ejecución inicial'],['ejecucion','En ejecución'],['completada','Completada'],['evaluada','Evaluada']],a.estado)}<h3>Juicios relacionados</h3>${project.juicios.map(j=>`<label class="row tiny"><input type="checkbox" name="juicios" value="${j.id}" ${(a.juicio_ids||[]).includes(j.id)?'checked':''}>${esc(j.texto.slice(0,95))}</label>`).join('')}<h3>Criterios relacionados</h3><div class="grid">${choices(a.criterios||[])}</div><button class="primary">Guardar</button></form>${id?`<hr><h3>Agregar hito de seguimiento</h3><form onsubmit="addActionHistory(event,'${id}')">${field('Fecha','fecha',today(),'date')}${field('Avance','texto','','textarea','required')}<button>Agregar avance</button></form>${(a.historial||[]).map(h=>`<p>${esc(h.fecha)} — ${esc(h.texto)}</p>`).join('')}`:''}`)}
function saveAction(e,id){e.preventDefault();let f=e.target,d=formData(f),a=project.acciones.find(x=>x.id===id);if(!a){a={id:uid(),historial:[]};project.acciones.push(a)}Object.assign(a,d,{juicio_ids:[...f.querySelectorAll('input[name=juicios]:checked')].map(x=>x.value),criterios:chosen(f)});closeModal();commit()}
function addActionHistory(e,id){e.preventDefault();project.acciones.find(x=>x.id===id).historial.push(formData(e.target));closeModal();commit()}
function renderFollowup(){return `<h1>Seguimiento y reportes</h1><div class="panel"><div class="row between"><h2>Acciones de mejora</h2><button class="primary" onclick="editAction()">+ Nueva acción</button></div>${project.acciones.map(a=>`<div class="item"><div class="row between"><h3>${esc(a.nombre)}</h3><button onclick="editAction('${a.id}')">Editar / avances</button></div><p>${esc(a.descripcion||'')}</p><span class="pill">${esc(a.estado)}</span> <span class="muted tiny">${esc(a.responsable||'')} · ${esc(a.fecha||'')}</span><p class="tiny">${chips(a.criterios)}</p>${(a.historial||[]).map(h=>`<p class="tiny">${esc(h.fecha)} — ${esc(h.texto)}</p>`).join('')}</div>`).join('')||'<p class="muted">Sin acciones registradas.</p>'}</div><div class="panel"><h2>Tareas declaradas desde verificaciones</h2>${project.observaciones.filter(o=>o.tipo==='tarea').map(o=>`<div class="item"><span class="pill tarea">${esc(o.estado)}</span> ${esc(o.texto)} <button onclick="editObservation('${o.id}')">Editar</button></div>`).join('')||'<p class="muted">Sin tareas.</p>'}</div><div class="panel"><h2>Resumen por criterio</h2>${allCriteria().map(c=>`<div class="item"><button onclick="openCriterion('${c.id}','analisis')">${esc(c.numero+'. '+c.nombre)}</button><span class="muted"> · Nivel estimado: ${esc(project.analisis[c.id]?.nivel||'Sin determinar')} · ${esc(project.analisis[c.id]?.estado||'Sin análisis')}</span></div>`).join('')}<button onclick="window.print()">Imprimir vista actual</button></div>`}
const origEditObservation=editObservation;
editObservation=function(id,cid='',itemId=''){origEditObservation(id,cid,itemId);$('modal').dataset.criterion=cid||project.observaciones.find(o=>o.id===id)?.criterio_id||criterionId;$('modal').dataset.item=itemId||project.observaciones.find(o=>o.id===id)?.item_id||''};
try{const p=JSON.parse(localStorage.getItem(STORAGE)||'null');if(p?.schema==='asistente-autoevaluacion'){project=p;project.analisis ||= {}}}catch(e){}
render();
</script></body></html>
