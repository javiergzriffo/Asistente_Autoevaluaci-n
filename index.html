function tabAnalysis(c){let a=project.analisis[c.id]||{},obs=project.observaciones.filter(o=>o.criterio_id===c.id);return `<h2>Análisis consolidado</h2>${levelGraph(c)}${acRenderConsolidated(c)}<div class="notice">Las observaciones creadas desde la lista de verificación se muestran automáticamente aquí, con su ítem de origen.</div>${[['fortaleza','Fortalezas'],['oportunidad','Oportunidades de mejora'],['tarea','Tareas']].map(([type,label])=>`<h3>${label} (${obs.filter(o=>o.tipo===type).length})</h3>${obs.filter(o=>o.tipo===type).map(o=>`<div class="item"><span class="pill ${type}">${catLabel[type]}</span> ${esc(o.texto)} <span class="muted tiny">· ${esc(o.item_id)} · ${esc(o.estado)}</span> <button onclick="editObservation('${o.id}')">Editar</button></div>`).join('')||'<p class="muted">Sin observaciones de esta categoría.</p>'}`).join('')}<hr><h3>Redacción progresiva del análisis</h3><form onsubmit="saveAnalysis(event,'${c.id}')">${field('Síntesis de situación actual','situacion',a.situacion||'','textarea')}${field('Fortalezas y debilidades','balance',a.balance||'','textarea')}${field('Evaluación global y fundamentación del nivel','juicio',a.juicio||'','textarea')}${sel('Nivel estimado','nivel',[['','Sin determinar'],['1','Nivel 1'],['2','Nivel 2'],['3','Nivel 3']],a.nivel||'')}${field('Proyecciones de mejoramiento','proyecciones',a.proyecciones||'','textarea')}${sel('Estado del análisis','estado',[['borrador','Borrador'],['validado','Validado']],a.estado||'borrador')}<button class="primary">Guardar análisis</button></form>`}
// Informe integral de antecedentes por criterio: no modifica el proyecto.
const acStateOrder={no_cumple:0,parcial:1,sin_evaluar:2,cumple:3,no_aplica:4};
function acCriterionItems(c){return (c.niveles||[]).flatMap(l=>(l.items||[]).filter(i=>!i.archivado).map(i=>({nivel:l.numero,item:i}))).sort((a,b)=>Number(a.nivel)-Number(b.nivel)||(acStateOrder[a.item.estado]??2)-(acStateOrder[b.item.estado]??2)||String(a.item.id).localeCompare(String(b.item.id),'es'))}
function acItemObservations(i){return (project.observaciones||[]).filter(o=>o.item_id===i.id)}
function acItemInventario(i){return (i.inventario_ids||[]).map(id=>project.inventario.find(r=>r.id===id)).filter(Boolean)}
function acCriterionEvidence(c){const ids=new Set;for(const {item:i} of acCriterionItems(c))for(const r of acItemInventario(i))ids.add(r.id);for(const r of project.inventario||[])if((r.criterios||[]).includes(c.id))ids.add(r.id);return [...ids].map(id=>project.inventario.find(r=>r.id===id)).filter(Boolean).sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es'))}
function acStatusIcon(k){return ({cumple:'✓',parcial:'◐',no_cumple:'✕',sin_evaluar:'○',no_aplica:'—'})[k]||'○'}
function acStatusClass(k){return ({cumple:'ac-ok',parcial:'ac-mid',no_cumple:'ac-no',sin_evaluar:'ac-idle',no_aplica:'ac-na'})[k]||'ac-idle'}
function acDetails(c){const items=acCriterionItems(c),evidences=acCriterionEvidence(c);return {items,evidences}}
function acRenderConsolidated(c){const {items,evidences}=acDetails(c);return `<section class="ac-report"><div class="row between ac-report-head"><div><h2>Antecedentes generales del criterio</h2><p class="muted tiny">Exigencias ordenadas por nivel y grado de cumplimiento; incluye vinculaciones, fundamentación y evidencias consolidadas.</p></div><div class="export-actions"><button onclick="acExport('${c.id}','txt')">↓ TXT</button><button onclick="acExport('${c.id}','excel')">↓ Excel</button><button onclick="acExport('${c.id}','pdf')">↓ PDF</button><button onclick="acExport('${c.id}','copy')">Copiar</button></div></div><div class="ac-summary">${['cumple','parcial','no_cumple','sin_evaluar','no_aplica'].map(k=>`<div class="ac-summary-card ${acStatusClass(k)}"><strong>${acStatusIcon(k)} ${items.filter(v=>(v.item.estado||'sin_evaluar')===k).length}</strong><small>${esc(stateLabel[k]||k)}</small></div>`).join('')}</div>${[1,2,3].map(n=>{const subset=items.filter(x=>Number(x.nivel)===n);return `<div class="ac-level"><h3>Nivel ${n} <span class="muted tiny">· ${subset.length} ítems</span></h3>${subset.map(({item:i})=>{let inv=acItemInventario(i),obs=acItemObservations(i),linked=(i.plan_mejora_ids||[]).map(id=>findPlanAction(id)).filter(Boolean);return `<article class="ac-item ${acStatusClass(i.estado)}"><div class="row between"><span class="tiny muted">${esc(i.id)}</span><span class="ac-state ${acStatusClass(i.estado)}">${acStatusIcon(i.estado)} ${esc(stateLabel[i.estado]||'Sin evaluar')}</span></div><p><strong>${esc(i.texto||'')}</strong></p><div class="ac-detail"><b>Inventario vinculado:</b> ${inv.length?inv.map(r=>`<button onclick="viewInventory('${esc(r.id)}')">${esc(r.nombre||r.id)}</button>`).join(' '):'<span class="muted">Sin registros vinculados</span>'}</div><div class="ac-detail"><b>Fundamentación:</b> ${esc(i.fundamentacion||'Sin fundamentación')}</div><div class="ac-detail"><b>Observaciones:</b> ${obs.length?obs.map(o=>`<div>• ${esc(catLabel[o.tipo]||o.tipo||'Observación')}: ${esc(o.texto||'')} ${o.estado?`<span class="muted">(${esc(o.estado)})</span>`:''}</div>`).join(''):'<span class="muted">Sin observaciones</span>'}</div>${linked.length?`<div class="ac-detail"><b>Plan de mejora vinculado:</b> ${linked.map(v=>esc(v.a.nombre||'Acción')+' · '+actionState(v.a)).join('; ')}</div>`:''}</article>`}).join('')||'<p class="muted">Sin ítems activos en este nivel.</p>'}</div>`}).join('')}<div class="ac-level"><h3>Evidencias y fuentes · listado consolidado (${evidences.length})</h3>${evidences.map(r=>`<article class="ac-evidence"><div class="row between"><b>${esc(r.nombre||r.id)}</b><button onclick="viewInventory('${esc(r.id)}')">Ver ficha</button></div>${r.descripcion?`<p class="tiny muted">${esc(r.descripcion)}</p>`:''}${(r.fuentes||[]).length?(r.fuentes||[]).map(f=>`<div class="ac-detail">📎 ${esc(f.nombre||r.nombre||'Evidencia')} ${/^https?:\/\//i.test(f.url||'')?`· <a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">${esc(f.url)}</a>`:esc(f.url||'')}</div>`).join(''):'<div class="muted tiny">Sin fuente asociada</div>'}</article>`).join('')||'<p class="muted">No existen evidencias asociadas al criterio o sus ítems.</p>'}</div></section>`}
function acExportData(c){const {items,evidences}=acDetails(c);const headers=['Sección','Criterio','Nivel','ID / Registro','Estado','Ítem / evidencia','Inventario vinculado','Fundamentación','Observaciones','Nombre de fuente','URL','Plan de mejora'];const rows=[];for(const {nivel,item:i} of items){const inv=acItemInventario(i);const obs=acItemObservations(i).map(o=>[catLabel[o.tipo]||o.tipo,o.texto,o.estado].filter(Boolean).join(': ')).join(' | ');const linked=(i.plan_mejora_ids||[]).map(id=>{const v=findPlanAction(id);return v?(v.a.nombre||'Acción')+' ('+actionState(v.a)+')':id}).join('; ');rows.push(['Verificación',c.numero+' · '+c.nombre,'Nivel '+nivel,i.id,acStatusIcon(i.estado)+' '+(stateLabel[i.estado]||'Sin evaluar'),i.texto||'',inv.map(r=>r.nombre||r.id).join('; '),i.fundamentacion||'',obs,'','',linked])}for(const r of evidences){const fs=(r.fuentes||[]);if(!fs.length)rows.push(['Evidencia',c.numero+' · '+c.nombre,'',r.id,'',r.nombre||'','',r.descripcion||'','','','','']);else for(const f of fs)rows.push(['Evidencia',c.numero+' · '+c.nombre,'',r.id,'',r.nombre||'','',r.descripcion||'','',f.nombre||r.nombre||'',f.url||'',''])}return {headers,rows}}
function acExport(cid,format){const c=getCriterion(cid);if(!c)return;const {headers,rows}=acExportData(c),title='Antecedentes generales CNA · Criterio '+c.numero+' · '+c.nombre,base='Antecedentes_CNA_Criterio_'+c.numero+'_'+today();const txt=title+'\nProyecto: '+project.nombre+'\nFecha: '+today()+'\n\n'+rows.map((r,i)=>'Registro '+(i+1)+'\n'+headers.map((h,j)=>h+': '+String(r[j]??'')).join('\n')).join('\n\n');if(format==='copy')return copyPlain(txt);if(format==='txt')return aeDownload(txt,base+'.txt','text/plain;charset=utf-8');const tbl='<table border="1"><thead><tr>'+headers.map(h=>'<th>'+aeSafe(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td style="mso-number-format:&#39;\\@&#39;">'+aeSafe(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';if(format==='excel')return aeDownload('\ufeff<!doctype html><html><head><meta charset="utf-8"></head><body><h2>'+aeSafe(title)+'</h2>'+tbl+'</body></html>',base+'.xls','application/vnd.ms-excel;charset=utf-8');if(format==='pdf'){const doc='<!doctype html><html lang="es"><head><meta charset="utf-8"><title>'+aeSafe(title)+'</title><style>body{font:11px Arial,sans-serif;color:#1d3044;margin:14mm}h1{font-size:18px}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #cedae6;padding:5px;overflow-wrap:anywhere;vertical-align:top;white-space:pre-wrap}th{background:#eaf2fa}tr{break-inside:avoid}@page{size:A4 landscape;margin:10mm}</style></head><body><h1>'+aeSafe(title)+'</h1><p>'+aeSafe(project.nombre)+' · '+today()+'</p>'+tbl+'</body></html>';const w=window.open('','_blank');if(!w)return alert('Habilita ventanas emergentes para imprimir el informe.');w.document.write(doc);w.document.close();w.addEventListener('load',()=>{w.focus();w.print()},{once:true})}}

function saveAnalysis(e,id){e.preventDefault();project.analisis[id]=formData(e.target);commit()}
function editAction(id,judgmentId=''){if(judgmentId&&project.juicios.find(j=>j.id===judgmentId)?.categoria!=='oportunidad'){alert('Solo las oportunidades de mejora admiten acciones.');return;}let a=project.acciones.find(x=>x.id===id)||{nombre:'',descripcion:'',estado:'proyectada',responsable:'',fecha:today(),juicio_ids:judgmentId?judgmentGroupIds(project.juicios.find(j=>j.id===judgmentId)):[],criterios:section==='criterios'?[criterionId]:[],historial:[]};modal(`<h2>${id?'Editar':'Nueva'} acción</h2><form onsubmit="saveAction(event,'${id||''}')">${field('Nombre','nombre',a.nombre,'text','required')}${field('Descripción','descripcion',a.descripcion,'textarea')}${field('Fecha','fecha',a.fecha,'date')}${field('Responsable','responsable',a.responsable)}${sel('Estado','estado',[['proyectada','Proyectada'],['diseno','En diseño'],['ejecucion_inicial','Ejecución inicial'],['ejecucion','En ejecución'],['completada','Completada'],['evaluada','Evaluada']],a.estado)}<h3>Juicios relacionados</h3>${project.juicios.filter(j=>j.categoria==='oportunidad'||(a.juicio_ids||[]).includes(j.id)).map(j=>`<label class="row tiny"><input type="checkbox" name="juicios" value="${j.id}" ${(a.juicio_ids||[]).includes(j.id)?'checked':''} ${j.categoria!=='oportunidad'?'disabled':''}>${esc(j.texto.slice(0,95))}${j.categoria!=='oportunidad'?' (vínculo histórico: no editable)':''}</label>`).join('')}<h3>Criterios relacionados</h3><div class="grid">${choices(a.criterios||[])}</div><button class="primary">Guardar</button></form>${id?`<hr><h3>Agregar hito de seguimiento</h3><form onsubmit="addActionHistory(event,'${id}')">${field('Fecha','fecha',today(),'date')}${field('Avance','texto','','textarea','required')}${sel('Cambiar el estado de la acción (opcional)','estado_nuevo',[['','Mantener estado actual'],['proyectada','Proyectada'],['diseno','En diseño'],['ejecucion_inicial','Ejecución inicial'],['ejecucion','En ejecución'],['completada','Completada'],['evaluada','Evaluada']],'')}${evidenceFields({evidencia_nombre:'',evidencia_url:''})}<button>Agregar avance</button></form>${stateHistoryMarkup(a)}`:''}`)}
function saveAction(e,id){e.preventDefault();let f=e.target,d=formData(f),a=project.acciones.find(x=>x.id===id);if(!a){a={id:uid(),historial:[]};project.acciones.push(a)}const chosenLinks=[...f.querySelectorAll('input[name=juicios]:checked')].map(x=>x.value);const historical=(a.juicio_ids||[]).filter(ref=>project.juicios.some(j=>j.id===ref&&j.categoria!=='oportunidad'));const expanded=chosenLinks.flatMap(id=>judgmentGroupIds(project.juicios.find(j=>j.id===id)));Object.assign(a,d,{juicio_ids:[...new Set([...expanded,...historical])],criterios:chosen(f)});closeModal();commit()}
function addActionHistory(e,id){e.preventDefault();const a=project.acciones.find(x=>x.id===id);if(!a)return;const d=formData(e.target),old=a.estado;a.historial ||= [];a.historial.push({...d,estado_anterior:old});if(d.estado_nuevo)a.estado=d.estado_nuevo;closeModal();commit()}
function renderFollowup(){return `<h1>Seguimiento y reportes</h1><div class="panel"><div class="row between"><h2>Acciones de mejora</h2><button class="primary" onclick="editAction()">+ Nueva acción</button></div>${project.acciones.map(a=>`<div class="item"><div class="row between"><h3>${esc(a.nombre)}</h3><div class="row"><button onclick="editAction('${a.id}')">Editar / avances</button><button class="danger mini-btn" onclick="deleteFollowupAction('${a.id}')">Eliminar</button></div></div><p>${esc(a.descripcion||'')}</p><span class="pill">${esc(a.estado)}</span> <span class="muted tiny">${esc(a.responsable||'')} · ${esc(a.fecha||'')}</span><p class="tiny">${chips(a.criterios)}</p>${stateHistoryMarkup(a)}</div>`).join('')||'<p class="muted">Sin acciones registradas.</p>'}</div><div class="panel"><h2>Tareas declaradas desde verificaciones</h2>${project.observaciones.filter(o=>o.tipo==='tarea').map(o=>`<div class="item"><span class="pill tarea">${esc(o.estado)}</span> ${esc(o.texto)} <button onclick="editObservation('${o.id}')">Editar</button> <button class="danger mini-btn" onclick="deleteFollowupTask('${o.id}')">Eliminar</button></div>`).join('')||'<p class="muted">Sin tareas.</p>'}</div><div class="panel"><h2>Resumen por criterio</h2>${allCriteria().map(c=>`<div class="item"><button onclick="openCriterion('${c.id}','analisis')">${esc(c.numero+'. '+c.nombre)}</button><span class="muted"> · Nivel estimado: ${esc(project.analisis[c.id]?.nivel||'Sin determinar')} · ${esc(project.analisis[c.id]?.estado||'Sin análisis')}</span></div>`).join('')}<button onclick="window.print()">Imprimir vista actual</button></div>`}

/* Exportaciones legibles independientes de la copia de respaldo JSON. */
function aeSafe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function aeDownload(content,name,mime){let b=new Blob([content],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function aeRowsVerification(cid=''){
 const rows=[];
 for(const c of allCriteria().filter(x=>!cid||x.id===cid))for(const l of c.niveles)for(const i of l.items){
  const inv=(i.inventario_ids||[]).map(id=>project.inventario.find(r=>r.id===id)?.nombre||id).join('; ');
  const obs=project.observaciones.filter(o=>o.item_id===i.id).map(o=>[catLabel[o.tipo]||o.tipo,o.texto,o.estado].filter(Boolean).join(': ')).join(' | ');
  rows.push([c.numero+' · '+c.nombre,'Nivel '+l.numero,i.id,i.texto,stateLabel[i.estado]||i.estado||'Sin evaluar',i.fundamentacion||'',inv,obs,(i.plan_mejora_ids||[]).map(id=>{const v=findPlanAction(id);return v?v.a.nombre+' ('+actionState(v.a)+')':id}).join('; ')]);
 }return rows;
}
function aeRowsInventory(cid=''){
 const rows=[];
 for(const r of project.inventario.filter(r=>!cid||(r.criterios||[]).includes(cid)||invScope(cid).some(x=>x.id===r.id))){
  const criteria=cid?[cid]:(r.criterios||[]).length?r.criterios:[''];
  for(const crit of criteria){const notes=invNotes(r,crit);const entries=notes.length?notes:[{texto:''}];
   for(const n of entries)rows.push([r.codigo||'',r.nombre||'',r.fecha||'',invOrigin(r),names[r.tipo]||r.tipo||'',crit?getCriterion(crit)?.nombre||crit:'',n.texto||'',r.descripcion||'',(r.fuentes||[]).map(f=>[f.nombre,f.url].filter(Boolean).join(' — ')).join('; ')]);
  }
 }
 return rows;
}
function aeExport(kind,format,criterion=''){
 const headers=kind==='verificacion'?['Criterio','Nivel','ID','Ítem','Estado','Fundamentación','Inventario asociado','Observaciones','Acciones plan mejora']:['Código','Nombre','Año / fecha','Origen','Tipo','Criterio','Anotación / contribución','Descripción','Fuentes o referencias'];
 const rows=kind==='verificacion'?aeRowsVerification(criterion):aeRowsInventory(criterion);
 const heading=(kind==='verificacion'?'Lista de verificación CNA':'Inventario de autoevaluación')+(criterion?' — '+(getCriterion(criterion)?.nombre||criterion):' — Todos los criterios');
 const base=(kind==='verificacion'?'Verificacion':'Inventario')+'_'+(criterion||'Completo')+'_'+today();
 if(format==='txt'||format==='copy'){let out=heading+'\nProyecto: '+project.nombre+'\nFecha: '+today()+'\n\n'+rows.map((r,i)=>'Registro '+(i+1)+'\n'+headers.map((h,j)=>h+': '+String(r[j]??'')).join('\n')).join('\n\n');if(format==='copy'){copyPlain(out);return}aeDownload(out,base+'.txt','text/plain;charset=utf-8');return}
 if(format==='excel'){let xml='<!doctype html><html><head><meta charset="utf-8"></head><body><table border="1"><thead><tr>'+headers.map(h=>'<th>'+aeSafe(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td style="mso-number-format:\'\\@\'">'+aeSafe(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></body></html>';aeDownload('\ufeff'+xml,base+'.xls','application/vnd.ms-excel;charset=utf-8');return}
 if(format==='pdf'){
  const html='<!doctype html><html lang="es"><head><meta charset="utf-8"><title>'+aeSafe(heading)+'</title><style>body{font:12px Arial,sans-serif;color:#172b42;margin:18mm}h1{font-size:20px}p{color:#52667b}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #d9e2ec;padding:6px;vertical-align:top;text-align:left;overflow-wrap:anywhere;white-space:pre-wrap}th{background:#e8f0f6}tr{break-inside:avoid}@page{size:A4 landscape;margin:12mm}</style></head><body><h1>'+aeSafe(heading)+'</h1><p>'+aeSafe(project.nombre)+' · '+today()+'</p><table><thead><tr>'+headers.map(h=>'<th>'+aeSafe(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+aeSafe(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></body></html>';
  let w=window.open('','_blank');if(!w){alert('El navegador bloqueó la ventana del informe. Permite ventanas emergentes para imprimir o guardar como PDF.');return}w.document.open();w.document.write(html);w.document.close();w.addEventListener('load',()=>{w.focus();w.print()},{once:true});return;
 }
}
function exportVerification(format,cid=''){aeExport('verificacion',format,cid)}
function exportInventory(format,cid=''){aeExport('inventario',format,cid)}

// Proceso anterior: repositorio autónomo de fuentes, dictámenes y acciones comprometidas.
function copyJSONProject(){if(project)copyPlain(JSON.stringify(project,null,2))}
function ensurePrevious(){if(!project)return;project.proceso_anterior ||= {fuentes:[],dictamenes:[]};project.proceso_anterior.fuentes ||= [];project.proceso_anterior.dictamenes ||= [];}
function prevSources(){ensurePrevious();return project.proceso_anterior.fuentes}
function prevDicts(){ensurePrevious();return project.proceso_anterior.dictamenes}
const prevCats={oportunidad:'Oportunidad de mejora',fortaleza:'Fortaleza',reconocimiento:'Reconocimiento'};
function prevSource(id){return prevSources().find(x=>x.id===id)}

// Evidencia y vínculo son campos separados; los proyectos anteriores se interpretan sin perder datos.
function evidenceFields(obj={},prefix=''){
 const value=obj.evidencia_nombre??obj.fuente_nombre??obj.fuente??obj.nombre??'';
 const url=obj.evidencia_url??obj.fuente_url??obj.url??'';
 return field('Evidencia o nombre del documento (opcional)',prefix+'evidencia_nombre',value)+field('Enlace de la fuente (opcional)',prefix+'evidencia_url',url,'url');
}
function evidenceView(obj={}){
 const name=obj.evidencia_nombre??obj.fuente_nombre??obj.fuente??obj.nombre??'';
 const url=obj.evidencia_url??obj.fuente_url??obj.url??'';
 const link=/^https?:\/\//i.test(url)?` <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Abrir fuente ↗</a>`:'';
 return name||link?`<span class="tiny">Evidencia: ${esc(name||'Sin nombre')}${link}</span>`:'';
}
function stateHistoryMarkup(a){return (a.historial||[]).map(h=>`<p class="tiny">${esc(h.fecha||'')} — ${esc(h.texto||'')}${h.estado_nuevo?' · Estado: '+esc(h.estado_anterior||'—')+' → '+esc(h.estado_nuevo):''}${h.evidencia_nombre?' · '+esc(h.evidencia_nombre):''}${evidenceView({evidencia_url:h.evidencia_url})}</p>`).join('')}
function linkedJudgmentNotice(j){if(judgmentStatus(j)==='superado'||j.categoria!=='oportunidad')return '';const acts=judgmentGroupActions(j);return acts.length&&acts.every(a=>['completada','evaluada'].includes(a.estado))?'<div class="notice">Todas las acciones vinculadas están completadas o evaluadas. Revisa si corresponde modificar el estado general del juicio; no se modifica automáticamente.</div>':''}
function previousActionStatus(a){return a.estado_seguimiento||(!validNumber(a.resultado)?'pendiente':actionState(a)==='Lograda'?'completada':'en_atencion')}
function addPlanActionHistory(e,did,aid){e.preventDefault();const d=prevDict(did),a=d?.acciones?.find(x=>x.id===aid);if(!a)return;const v=formData(e.target),old=previousActionStatus(a),next=v.estado_nuevo||old;a.historial ||= [];a.historial.push({fecha:v.fecha,texto:v.texto,estado_anterior:old,estado_nuevo:v.estado_nuevo||'',evidencia_nombre:v.evidencia_nombre||'',evidencia_url:v.evidencia_url||''});if(v.estado_nuevo)a.estado_seguimiento=next;closeModal();commit()}
function planHistoryForm(did,a){return `<h3>Historial de seguimiento</h3><form onsubmit="addPlanActionHistory(event,'${did}','${a.id}')">${field('Fecha','fecha',today(),'date')}${field('Antecedente de seguimiento','texto','','textarea','required')}${sel('Cambiar estado de la acción (opcional)','estado_nuevo',[['','Mantener estado actual'],['pendiente','Pendiente'],['en_atencion','En atención'],['completada','Completada'],['desestimada','Desestimada']], '')}${evidenceFields({evidencia_nombre:'',evidencia_url:''})}<button>Agregar al historial</button><button type="button" onclick="closeModal()">Cerrar</button></form>${stateHistoryMarkup(a)}`}
function editPlanHistory(did,aid){const a=prevDict(did)?.acciones?.find(x=>x.id===aid);if(a)modal(`<h2>Seguimiento: ${esc(a.nombre)}</h2><p class="muted">Estado de seguimiento: ${esc(previousActionStatus(a))} · Cumplimiento de meta: ${esc(actionState(a))}. Son datos independientes.</p>${planHistoryForm(did,a)}`)}

function prevDict(id){return prevDicts().find(x=>x.id===id)}
function findPlanAction(id){for(const d of prevDicts()){const a=(d.acciones||[]).find(a=>a.id===id);if(a)return {d,a}}return null}
function pct(n){return Math.round(100*n*10)/10}
function validNumber(v){return v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v))}
function actionState(a){if(!validNumber(a.resultado))return 'Pendiente';if(!validNumber(a.meta))return 'Meta sin definir';return Number(a.resultado)>=Number(a.meta)?'Lograda':'Bajo la meta'}
function dictMetrics(d){let a=d.acciones||[],done=a.filter(x=>validNumber(x.resultado)).length,completed=a.filter(x=>actionState(x)==='Lograda').length;return {total:a.length,done,completed,readiness:a.length?pct(done/a.length):0,compliance:a.length?pct(completed/a.length):0}}
function prevSourceLink(f){if(!f?.url)return '';return `<a href="${esc(/^https?:\/\//i.test(f.url)?f.url:'#')}" target="_blank" rel="noopener noreferrer">${esc(f.nombre||'Abrir fuente')} ↗</a>`}
function prevToolbar(type,cid=''){return `<div class="export-actions"><button onclick="exportPrevious('${type}','txt','${cid}')">↓ TXT</button><button onclick="exportPrevious('${type}','excel','${cid}')">↓ Excel</button><button onclick="exportPrevious('${type}','pdf','${cid}')">↓ PDF</button><button onclick="exportPrevious('${type}','copy','${cid}')">Copiar</button></div>`}
function renderPrevious(){return `<div class="row between"><div><h1>Proceso anterior</h1><p class="muted">Registra las fuentes documentales de procesos previos y los dictámenes vinculados a cada una.</p></div>${prevToolbar('todo')}</div><div class="row between"><h2>Fuentes documentales</h2><button class="primary" onclick="editPrevSource()">+ Nueva fuente</button></div><div class="prev-grid">${prevSources().map(f=>`<article class="prev-card"><div class="row between"><h3>${esc(f.nombre)}</h3><div><button onclick="editPrevSource('${f.id}')">Editar</button><button class="danger" onclick="deletePrevSource('${f.id}')">Eliminar</button></div></div>${prevSourceLink(f)}<p>${esc(f.descripcion||'')}</p><div class="tiny muted">${prevDicts().filter(d=>d.fuente_id===f.id).length} dictámenes</div><button onclick="editPrevDict('','${f.id}')">+ Añadir dictamen</button>${prevDicts().filter(d=>d.fuente_id===f.id).map(d=>`<div class="prev-mini ${esc(d.categoria)}"><b>${esc(prevCats[d.categoria])}</b><p>${esc(d.texto)}</p><button onclick="editPrevDict('${d.id}')">Editar dictamen</button></div>`).join('')}</article>`).join('')||'<div class="panel">Sin fuentes. Agrega una fuente con nombre y, opcionalmente, un enlace.</div>'}</div>`}
function editPrevSource(id=''){let f=prevSource(id)||{nombre:'',url:'',descripcion:''};modal(`<h2>${id?'Editar':'Nueva'} fuente del proceso anterior</h2><form onsubmit="savePrevSource(event,'${id}')">${field('Nombre de la fuente','nombre',f.nombre,'text','required')}${field('Fecha del evento o dictamen (opcional)','fecha',f.fecha||'','date')}${field('Enlace de la fuente (opcional)','url',f.url||'','url')}${field('Descripción (opcional)','descripcion',f.descripcion||'','textarea')}<button class="primary">Guardar fuente</button><button type="button" onclick="closeModal()">Cancelar</button></form>`)}
function savePrevSource(e,id){e.preventDefault();const d=formData(e.target);let f=prevSource(id);if(!f){f={id:uid()};prevSources().push(f)}Object.assign(f,d);closeModal();commit()}
function deletePrevSource(id){const linked=prevDicts().filter(x=>x.fuente_id===id);if(!confirm(`¿Eliminar la fuente? ${linked.length} dictámenes se conservarán sin fuente asociada.`))return;project.proceso_anterior.fuentes=prevSources().filter(f=>f.id!==id);linked.forEach(d=>d.fuente_id='');commit()}
function renderDictamens(){let order=['oportunidad','fortaleza','reconocimiento'];return `<div class="row between"><div><h1>Dictámenes</h1><p class="muted">Dictámenes históricos; las metas de las acciones y los antecedentes cualitativos se registran por separado.</p></div><div>${prevToolbar('todo')}<button class="primary" onclick="editPrevDict()">+ Nuevo dictamen</button></div></div>${order.map(cat=>`<section><h2>${prevCats[cat]} (${prevDicts().filter(d=>d.categoria===cat).length})</h2><div class="prev-grid">${prevDicts().filter(d=>d.categoria===cat).map(dictCard).join('')||'<p class="muted">Sin dictámenes registrados.</p>'}</div></section>`).join('')}`}
function dictCard(d){let f=prevSource(d.fuente_id),m=dictMetrics(d);return `<article class="prev-card prev-${esc(d.categoria)}"><div class="row between"><span class="prev-chip ${esc(d.categoria)}">${esc(prevCats[d.categoria])}</span><div><button onclick="editPrevDict('${d.id}')">Editar</button><button class="danger" onclick="deletePrevDict('${d.id}')">Eliminar</button></div></div><p class="prev-statement">${esc(d.texto)}</p><div class="tiny muted">${chips(d.criterios||[])} · ${esc(f?.nombre||'Fuente no informada')} ${prevSourceLink(f)}</div>${d.categoria==='oportunidad'?`<div class="prev-metrics"><div><strong>${m.done}/${m.total}</strong><span>Acciones con resultado informado (${m.readiness}%)</span></div><div><strong>${m.compliance}%</strong><span>Metas logradas (${m.completed}/${m.total})</span></div></div><h4>Acciones de plan de mejora</h4>${(d.acciones||[]).map(a=>`<div class="prev-mini"><div class="row between"><b>${esc(a.nombre)}</b><span class="pill">${actionState(a)}</span></div><p class="tiny">Responsable: ${esc(a.responsable||'—')} · Indicador: ${esc(a.indicador||'—')}</p><p class="tiny">Meta: ${esc(a.meta??'—')} · Resultado: ${esc(a.resultado===''||a.resultado==null?'No informado':a.resultado)}</p>${a.fuente_nombre?`<p class="tiny">Fuente: ${esc(a.fuente_nombre)} ${prevSourceLink({nombre:'Abrir',url:a.fuente_url||''})}</p>`:''}<button onclick="editPlanAction('${d.id}','${a.id}')">Editar acción</button><button onclick="editPlanHistory('${d.id}','${a.id}')">Seguimiento / historial</button><p class="tiny">Estado de seguimiento: ${esc(previousActionStatus(a))}</p>${stateHistoryMarkup(a)}<button class="danger" onclick="deletePlanAction('${d.id}','${a.id}')">Eliminar</button></div>`).join('')||'<p class="tiny muted">Sin acciones comprometidas</p>'}<button onclick="editPlanAction('${d.id}')">+ Acción de mejora</button><h4>Antecedentes cualitativos</h4>${(d.antecedentes||[]).map(a=>`<div class="prev-mini"><p><strong>Antecedente:</strong> ${esc(a.texto)}</p><div class="antecedent-answer"><strong>Respuesta:</strong> <span style="white-space:pre-wrap">${esc(a.respuesta||'Sin respuesta registrada')}</span></div><small>${esc(a.fecha||'')} · ${evidenceView({evidencia_nombre:a.fuente||'',evidencia_url:a.fuente_url||''})}</small> <button onclick="editPrevAntecedent('${d.id}','${a.id}')">Editar</button><button class="danger" onclick="deletePrevAntecedent('${d.id}','${a.id}')">Eliminar</button></div>`).join('')||'<p class="tiny muted">Sin antecedentes</p>'}<button onclick="editPrevAntecedent('${d.id}')">+ Añadir antecedente</button>`:''}</article>`}
function editPrevDict(id='',sourceId=''){const d=prevDict(id)||{texto:'',fecha:invDateFromSource('dictamen',sourceId),categoria:'oportunidad',fuente_id:sourceId,criterios:[],acciones:[],antecedentes:[]};modal(`<h2>${id?'Editar':'Nuevo'} dictamen</h2><form onsubmit="savePrevDict(event,'${id}')">${field('Texto del dictamen','texto',d.texto,'textarea','required')}${field('Fecha','fecha',d.fecha||today(),'date')}${sel('Categoría','categoria',Object.entries(prevCats),d.categoria)}${sel('Fuente','fuente_id',[['','Sin fuente'],...prevSources().map(f=>[f.id,f.nombre])],d.fuente_id).replace('<select ','<select onchange="updateDictDateFromSource(this)" ')}<h3>Criterios CNA asociados</h3><div class="grid">${choices(d.criterios||[])}</div><button class="primary">Guardar dictamen</button><button type="button" onclick="closeModal()">Cancelar</button></form>`)}
function savePrevDict(e,id){e.preventDefault();const f=e.target,d=formData(f);let x=prevDict(id);if(!x){x={id:uid(),acciones:[],antecedentes:[]};prevDicts().push(x)}Object.assign(x,d,{criterios:chosen(f)});closeModal();commit()}
function deletePrevDict(id){if(!confirm('¿Eliminar este dictamen junto a sus acciones y antecedentes? Se retirarán también sus vínculos en la verificación.'))return;const a=new Set((prevDict(id)?.acciones||[]).map(x=>x.id));project.proceso_anterior.dictamenes=prevDicts().filter(d=>d.id!==id);for(const c of allCriteria())for(const i of allItems(c))i.plan_mejora_ids=(i.plan_mejora_ids||[]).filter(x=>!a.has(x));commit()}
function editPlanAction(did,aid=''){const a=(prevDict(did)?.acciones||[]).find(x=>x.id===aid)||{nombre:'',responsable:'',indicador:'',meta:'',resultado:'',fuente_nombre:'',fuente_url:''};modal(`<h2>${aid?'Editar':'Nueva'} acción de plan de mejora</h2><form onsubmit="savePlanAction(event,'${did}','${aid}')">${field('Nombre','nombre',a.nombre,'text','required')}${field('Responsable','responsable',a.responsable)}${field('Indicador','indicador',a.indicador)}${field('Meta esperada (numérica)','meta',a.meta,'number','required step="any"')}${field('Resultado observado (opcional)','resultado',a.resultado,'number','step="any"')}${field('Evidencia o nombre de documento','fuente_nombre',a.fuente_nombre||'')}${field('Enlace de la fuente','fuente_url',a.fuente_url||'','url')}<h3>Inventario vinculado</h3>${inventoryLinkField('inventario_ids',a.inventario_ids||[],prevDict(did)?.criterios?.[0]||'')}<p class="tiny muted">Resultado ≥ meta: lograda. Resultado inferior: bajo la meta. Sin resultado: pendiente. El cumplimiento se calcula sobre el número de acciones comprometidas.</p><button class="primary">Guardar acción</button><button type="button" onclick="closeModal()">Cancelar</button></form>`)}
function savePlanAction(e,did,aid){e.preventDefault();const d=prevDict(did);if(!d)return;d.acciones ||= [];let a=d.acciones.find(x=>x.id===aid);if(!a){a={id:uid()};d.acciones.push(a)}Object.assign(a,formData(e.target),{inventario_ids:invSelected(e.target,'inventario_ids')});closeModal();commit()}
function deletePlanAction(did,aid){if(!confirm('¿Eliminar esta acción de mejora?'))return;const d=prevDict(did);d.acciones=d.acciones.filter(a=>a.id!==aid);for(const c of allCriteria())for(const i of allItems(c))i.plan_mejora_ids=(i.plan_mejora_ids||[]).filter(x=>x!==aid);commit()}
function editPrevAntecedent(did,aid=''){let a=(prevDict(did)?.antecedentes||[]).find(x=>x.id===aid)||{texto:'',fecha:today(),fuente:''};modal(`<h2>Antecedente cualitativo</h2><form onsubmit="savePrevAntecedent(event,'${did}','${aid}')">${field('Antecedente','texto',a.texto,'textarea','required')}${field('Respuesta al antecedente','respuesta',a.respuesta||'','textarea')}${field('Fecha','fecha',a.fecha,'date')}${field('Evidencia o nombre de documento (opcional)','fuente',a.fuente||'')}${field('Enlace de fuente (opcional)','fuente_url',a.fuente_url||'','url')}<button class="primary">Guardar antecedente</button><button type="button" onclick="closeModal()">Cancelar</button></form>`)}
function savePrevAntecedent(e,did,aid){e.preventDefault();const d=prevDict(did);d.antecedentes ||= [];let a=d.antecedentes.find(x=>x.id===aid);if(!a){a={id:uid()};d.antecedentes.push(a)}Object.assign(a,formData(e.target));closeModal();commit()}
function deletePrevAntecedent(did,aid){if(!confirm('¿Eliminar antecedente?'))return;const d=prevDict(did);d.antecedentes=d.antecedentes.filter(x=>x.id!==aid);commit()}
function tabPreviousCriterion(c){let ds=prevDicts().filter(d=>(d.criterios||[]).includes(c.id));return `<div class="row between"><div><h2>Dictámenes del proceso anterior</h2><p class="muted">Las acciones comprometidas se distinguen de los antecedentes que contextualizan los resultados.</p></div>${prevToolbar('dictamenes',c.id)}</div>${['oportunidad','fortaleza','reconocimiento'].map(cat=>`<h3>${prevCats[cat]}</h3><div class="prev-grid">${ds.filter(x=>x.categoria===cat).map(dictCard).join('')||'<p class="tiny muted">Sin dictámenes</p>'}</div>`).join('')}`}
function previousActionCheckboxes(i){return prevDicts().filter(d=>d.categoria==='oportunidad').flatMap(d=>(d.acciones||[]).map(a=>`<label class="tiny row"><input type="checkbox" name="plan_mejora" value="${esc(a.id)}" ${(i.plan_mejora_ids||[]).includes(a.id)?'checked':''}>${esc(a.nombre)} — ${esc(actionState(a))}</label>`)).join('')||'<p class="muted tiny">Sin acciones de mejora del proceso anterior.</p>'}
function previousActionLinks(i){return (i.plan_mejora_ids||[]).map(id=>{let v=findPlanAction(id);return v?`<button title="${esc(v.d.texto)}" onclick="openCriterion('${criterionId}','anteriores')">${esc(v.a.nombre)} · ${esc(actionState(v.a))}</button>`:''}).join(' ')}
function levelGraph(c){return `<div class="panel"><h3>Progresión de exigencias por nivel CNA</h3>${c.niveles.map(l=>{let its=l.items||[],filled=its.filter(x=>x.estado&&x.estado!=='sin_evaluar').length,full=its.filter(x=>x.estado==='cumple').length,percent=its.length?pct(filled/its.length):0;return `<div class="prev-level"><div class="row between"><strong>Nivel ${l.numero}</strong><span class="tiny">${filled}/${its.length} evaluados · ${full} cumplen</span></div><div class="prev-track"><span style="width:${percent}%"></span></div></div>`}).join('')}<p class="tiny muted">Representa el avance de evaluación de las exigencias de cada nivel, no la acreditación automática del nivel.</p></div>`}
function previousRows(type,cid=''){const rows=[];if(type==='todo'||type==='fuentes')for(const f of prevSources())rows.push(['Fuente',f.nombre,f.url||'',f.descripcion||'','','','','','','','','']);if(type==='todo'||type==='dictamenes')for(const d of prevDicts().filter(x=>!cid||(x.criterios||[]).includes(cid))){const source=prevSource(d.fuente_id);rows.push(['Dictamen',prevCats[d.categoria],d.texto,source?.nombre||'',d.fecha||'',(d.criterios||[]).join(', '),'','','','','','']);for(const a of d.acciones||[])rows.push(['Acción plan mejora',prevCats[d.categoria],d.texto,a.nombre,a.responsable,a.indicador,a.meta,a.resultado,actionState(a),a.fuente_nombre||'',a.fuente_url||'',(d.criterios||[]).join(', ')]);for(const a of d.antecedentes||[])rows.push(['Antecedente cualitativo',prevCats[d.categoria],d.texto,a.texto,a.fecha||'',a.fuente||'','','',a.respuesta||'','',(d.criterios||[]).join(', ')])}return rows}
function plainRows(title,headers,rows){return title+'\nProyecto: '+project.nombre+'\nFecha: '+today()+'\n\n'+rows.map((row,n)=>'Registro '+(n+1)+'\n'+headers.map((h,i)=>h+': '+String(row[i]??'')).join('\n')).join('\n\n')}
async function copyPlain(t){try{await navigator.clipboard.writeText(t);alert('Texto copiado. Puedes pegarlo en correo, WhatsApp u otra aplicación.')}catch(e){const field=document.createElement('textarea');field.value=t;document.body.append(field);field.select();const ok=document.execCommand('copy');field.remove();alert(ok?'Texto copiado':'No se pudo copiar automáticamente. Usa la descarga TXT.')}}
function exportPrevious(type,format,cid=''){let headers=['Tipo de registro','Categoría / nombre','Dictamen / enlace','Acción / antecedente','Responsable / fecha','Indicador / referencia','Meta','Resultado','Estado','Fuente / respuesta al antecedente','URL','Criterios'],rows=previousRows(type,cid),title='Proceso anterior y dictámenes'+(cid?' — '+getCriterion(cid)?.nombre:'');const base='Proceso_Anterior_'+today();if(format==='copy'){copyPlain(plainRows(title,headers,rows));return}if(format==='txt'){aeDownload(plainRows(title,headers,rows),base+'.txt','text/plain;charset=utf-8');return}if(format==='excel'){let html='<!doctype html><html><head><meta charset="utf-8"></head><body><table border="1"><tr>'+headers.map(x=>'<th>'+aeSafe(x)+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td style="mso-number-format:\'\\@\'">'+aeSafe(x)+'</td>').join('')+'</tr>').join('')+'</table></body></html>';aeDownload('\ufeff'+html,base+'.xls','application/vnd.ms-excel;charset=utf-8');return}if(format==='pdf'){let html='<!doctype html><html lang="es"><head><meta charset="utf-8"><title>'+aeSafe(title)+'</title><style>body{font:12px Arial;margin:16mm}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bac8d6;padding:5px;overflow-wrap:anywhere}th{background:#eaf1fb}@page{size:A4 landscape}</style></head><body><h1>'+aeSafe(title)+'</h1><table><tr>'+headers.map(h=>'<th>'+aeSafe(h)+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+aeSafe(v)+'</td>').join('')+'</tr>').join('')+'</table></body></html>';const w=window.open('','_blank');if(!w)return alert('Permite las ventanas emergentes para imprimir.');w.document.write(html);w.document.close();w.addEventListener('load',()=>w.print(),{once:true})}}

/* Módulo Consolidar: información propia, compatible con el JSON anterior. */
let consCriterion='C1',consTab='previo',consSummaryFilter='',consSeenOpen=false;
const CONS_COLORS={rojo:'Aparente debilidad fuerte',naranjo:'Aparente debilidad débil',verde:'Aparente constatación',azul:'Aparente fortaleza'};
const CONS_DECISIONS={fortaleza:'Fortaleza',constatacion:'Constatación',oportunidad:'Oportunidad de mejora',debilidad:'Debilidad',desechar:'Desechar'};
const CONS_RESPONSE_BASE=['problematiza','matiza','contextualiza','refuerza'];
function consEnsure(){project.consolidacion ||= {criterios:{},categorias_respuestas:[...CONS_RESPONSE_BASE]};project.consolidacion.criterios ||= {};project.consolidacion.categorias_respuestas ||= [...CONS_RESPONSE_BASE];for(const c of allCriteria()){project.consolidacion.criterios[c.id] ||= {vistos:[],borradores:[],nivel:''};const d=project.consolidacion.criterios[c.id];d.vistos ||= [];d.borradores ||= [];d.nivel ||= ''}return project.consolidacion}
function consData(cid=consCriterion){return consEnsure().criterios[cid]}
function consFind(cid,id){return consData(cid).borradores.find(b=>b.id===id)}
function consSwitchCriterion(cid){consCriterion=cid;consTab='previo';section='consolidar';render()}
function consSwitchTab(tab){consTab=tab;render()}
function consActions(){return `<div class="cons-export"><span class="cons-quiet">Exportar esta vista:</span><button onclick="consExport('excel')">↓ Excel</button><button onclick="consExport('txt')">↓ Texto plano</button><button onclick="consExport('pdf')">↓ PDF</button></div>`}
function renderConsolidar(){consEnsure();let c=getCriterion(consCriterion)||allCriteria()[0];const all=consCriterion==='todos';if(!all)consCriterion=c.id;return `<h1>Consolidar</h1><div class="cons-context"><strong>Etapa formal de autoevaluación.</strong> Este módulo está diseñado para la etapa formal de autoevaluación de la carrera en el contexto de un proceso de acreditación. Permite transformar el análisis previo en borradores de juicio, respuestas de contrastación, decisiones del comité y una síntesis final por criterio.</div><div class="cons-criterion-tabs">${allCriteria().map(x=>`<button class="${consCriterion===x.id?'active':''}" onclick="consSwitchCriterion('${x.id}')">${esc(x.numero+'. '+x.nombre)}</button>`).join('')}<button class="${consCriterion==='todos'?'active':''}" onclick="consOpenOverview()">Consolidado del proceso</button></div>${consCriterion==='todos'?consOverview():`<section><div class="cons-subtabs">${[['previo','Análisis previo'],['borradores','Borradores'],['definicion','Definición'],['consolidado','Consolidado']].map(([v,t])=>`<button class="${consTab===v?'active':''}" onclick="consSwitchTab('${v}')">${t}</button>`).join('')}</div>${consActions()}${consTab==='previo'?consPrevio(c):consTab==='borradores'?consBorradores(c):consTab==='definicion'?consDefinicion(c):consFinal(c)}</section>`}`}
function consOpenOverview(){consCriterion='todos';consSummaryFilter='';render()}
function consPrevio(c){const d=consData(c.id),items=acCriterionItems(c);return `${levelGraph(c)}<div class="panel"><h2>Antecedentes generales del criterio</h2><p class="muted">Las fichas reproducen los ítems evaluados en Criterios CNA. Ábrelas para ver inventario, fundamentación, observaciones y acciones relacionadas. Marca «OK» una vez revisadas.</p>${[1,2,3].map(n=>{const subset=items.filter(x=>Number(x.nivel)===n),pending=subset.filter(x=>!d.vistos.includes(x.item.id)),done=subset.filter(x=>d.vistos.includes(x.item.id));return `<details class="cons-fold" ${n===1?'open':''}><summary>Nivel ${n} · ${pending.length} por revisar · ${done.length} revisados</summary>${pending.map(x=>consCheckCard(c.id,x.item,false)).join('')||'<p class="muted tiny">Sin pendientes en este nivel.</p>'}${done.length?`<details class="cons-fold"><summary>Ya vistos (${done.length})</summary>${done.map(x=>consCheckCard(c.id,x.item,true)).join('')}</details>`:''}</details>`}).join('')}</div>`}
function consCheckCard(cid,i,seen){const inv=acItemInventario(i),obs=acItemObservations(i),drafts=consData(cid).borradores.filter(b=>(b.item_ids||[]).includes(i.id));const indicators=[['Inventario',inv.length],['Fundamentación',i.fundamentacion?.trim()?1:0],['Observaciones',obs.length]];return `<article class="cons-card ${seen?'cons-done':''}"><div class="row between"><span class="cons-code">${esc(i.id)}</span><span class="ac-state ${acStatusClass(i.estado)}">${acStatusIcon(i.estado)} ${esc(stateLabel[i.estado]||'Sin evaluar')}</span></div><div class="cons-title" style="margin-top:9px">${esc(i.texto)}</div><div class="cons-indicators">${indicators.map(([t,v])=>`<span class="${v?'yes':'no'}">${esc(t)}: ${v?esc(v):'—'}</span>`).join('')}${drafts.length?`<span class="yes">${drafts.length} borrador(es)</span>`:''}</div><div class="cons-actions"><button onclick="consCheckDetail('${cid}','${i.id}')">Ver detalles</button><button class="primary" onclick="consEditDraft('${cid}','','${i.id}')">+ Emitir borrador de juicio</button><button onclick="consToggleSeen('${cid}','${i.id}')">${seen?'↶ Volver a pendientes':'✓ OK'}</button></div></article>`}
function consCheckDetail(cid,itemId){const c=getCriterion(cid),i=allItems(c).find(x=>x.id===itemId);if(!i)return;const inv=acItemInventario(i),obs=acItemObservations(i),linked=(i.plan_mejora_ids||[]).map(id=>findPlanAction(id)).filter(Boolean);modal(`<h2>Antecedente ${esc(i.id)}</h2><p class="cons-title">${esc(i.texto)}</p><div class="cons-modal-meta"><span>${esc(stateLabel[i.estado]||'Sin evaluar')}</span><span>${esc(c.nombre)}</span></div><h3>Inventario vinculado (${inv.length})</h3>${inv.map(r=>`<p><button onclick="viewInventory('${esc(r.id)}')">${esc(r.codigo||'')} · ${esc(r.nombre)}</button></p>`).join('')||'<p class="muted">Sin inventario vinculado.</p>'}<h3>Fundamentación</h3><div class="cons-preview">${esc(i.fundamentacion||'Sin fundamentación.')}</div><h3>Observaciones (${obs.length})</h3>${obs.map(o=>`<div class="cons-preview"><b>${esc(catLabel[o.tipo]||o.tipo)}</b> · ${esc(o.estado||'')}<p>${esc(o.texto)}</p></div>`).join('')||'<p class="muted">Sin observaciones.</p>'}<h3>Acciones asociadas</h3>${linked.map(v=>`<p>${esc(v.a.nombre)} (${esc(actionState(v.a))})</p>`).join('')||'<p class="muted">Sin acciones relacionadas.</p>'}<div class="cons-actions"><button class="primary" onclick="consEditDraft('${cid}','','${itemId}')">+ Emitir borrador de juicio</button><button onclick="closeModal()">Cerrar</button></div>`)}
function consToggleSeen(cid,id){const d=consData(cid),set=new Set(d.vistos);set.has(id)?set.delete(id):set.add(id);d.vistos=[...set];commit()}
function consNextCode(cid){const n=Number(getCriterion(cid).numero);let i=1;const used=new Set(consData(cid).borradores.map(b=>b.codigo));while(used.has('BJ-'+n+'_'+String(i).padStart(3,'0')))i++;return 'BJ-'+n+'_'+String(i).padStart(3,'0')}
function consEditDraft(cid,id='',itemId=''){const b=consFind(cid,id)||{juicio:'',desarrollo:'',color:'verde',item_ids:itemId?[itemId]:[]};modal(`<h2>${id?'Editar':'Emitir'} borrador de juicio evaluativo</h2><p class="muted">${esc(getCriterion(cid).nombre)} · ${id?esc(b.codigo):'Código automático al guardar'}</p><form onsubmit="consSaveDraft(event,'${cid}','${id}','${itemId}')">${field('Borrador de juicio evaluativo','juicio',b.juicio,'textarea','required')}${field('Desarrollo o explicación del juicio','desarrollo',b.desarrollo,'textarea')}${sel('Caracterización preliminar','color',Object.entries(CONS_COLORS),b.color)}<p class="cons-quiet">${(b.item_ids||[]).length?'Antecedentes de origen: '+esc(b.item_ids.join(', ')):'El borrador quedará asociado a este criterio.'}</p><div class="cons-actions"><button class="primary">Guardar borrador</button><button type="button" onclick="closeModal()">Cancelar</button></div></form>`)}
function consSaveDraft(e,cid,id,itemId){e.preventDefault();const v=formData(e.target),d=consData(cid);let b=consFind(cid,id);if(!b){b={id:uid(),codigo:consNextCode(cid),item_ids:itemId?[itemId]:[],respuestas:[],dictamen:'',fecha:today()};d.borradores.push(b)}Object.assign(b,{juicio:v.juicio.trim(),desarrollo:v.desarrollo.trim(),color:v.color});closeModal();commit()}
function consDeleteDraft(cid,id){const d=consData(cid),b=consFind(cid,id);if(!b||!confirm('¿Eliminar '+b.codigo+' y todas sus respuestas y decisiones?'))return;d.borradores=d.borradores.filter(x=>x.id!==id);commit()}
function consDraftCard(cid,b,mode){const isDefinition=mode==='definicion';const responses=b.respuestas||[];return `<article class="cons-card cons-${esc(b.color||'verde')}"><div class="row between"><span class="cons-code">${esc(b.codigo)}</span><span class="pill">${esc(CONS_COLORS[b.color]||'Sin caracterizar')}</span>${b.dictamen?`<span class="pill">Dictamen: ${esc(CONS_DECISIONS[b.dictamen]||b.dictamen)}</span>`:''}</div><p class="cons-title">${esc(b.juicio)}</p>${b.desarrollo?`<p class="cons-preview">${esc(b.desarrollo)}</p>`:''}<div class="cons-quiet">Emitido: ${esc(b.fecha||'—')}${(b.item_ids||[]).length?' · Antecedente: '+esc(b.item_ids.join(', ')):''}</div>${responses.map(r=>`<div class="cons-response"><div class="row between"><div><span class="cons-tag">${esc(r.categoria||'Respuesta')}</span><span class="cons-code">${esc(r.codigo)}</span> <span class="cons-quiet">${esc(r.fecha||'')}</span></div><div><button class="mini-btn" onclick="consEditResponse('${cid}','${b.id}','${r.id}')">Editar</button><button class="mini-btn danger" onclick="consDeleteResponse('${cid}','${b.id}','${r.id}')">Eliminar</button></div></div><p>${esc(r.texto)}</p></div>`).join('')}${mode!=='final'?`<div class="cons-actions">${isDefinition?`<button class="primary" onclick="consDirimir('${cid}','${b.id}')">⚖ ${b.dictamen?'Modificar dictamen':'Dirimir'}</button>`:`<button onclick="consEditDraft('${cid}','${b.id}')">Editar borrador</button><button class="primary" onclick="consEditResponse('${cid}','${b.id}')">+ Responder</button><button class="danger" onclick="consDeleteDraft('${cid}','${b.id}')">Eliminar</button>`}</div>`:''}</article>`}
function consBorradores(c){const drafts=consData(c.id).borradores;return `<div class="panel"><div class="row between"><h2>Borradores de juicio evaluativo (${drafts.length})</h2><button class="primary" onclick="consEditDraft('${c.id}')">+ Nuevo borrador</button></div><p class="cons-quiet">Las respuestas recogen ideas del comité de autoevaluación o del comité ampliado, surgidas en instancias de triangulación, validación o contestación de los juicios.</p>${drafts.map(b=>consDraftCard(c.id,b,'borradores')).join('')||'<p class="muted">No hay borradores. Emítelos desde Análisis previo o crea uno aquí.</p>'}</div>`}
function consNextResponseCode(b){let n=1,used=new Set((b.respuestas||[]).map(r=>r.codigo));while(used.has('R-'+b.codigo+'_'+String(n).padStart(2,'0')))n++;return 'R-'+b.codigo+'_'+String(n).padStart(2,'0')}
function consEditResponse(cid,bid,rid=''){const b=consFind(cid,bid);if(!b)return;const r=(b.respuestas||[]).find(x=>x.id===rid)||{texto:'',categoria:'refuerza',fecha:today()};modal(`<h2>${rid?'Editar':'Nueva'} respuesta</h2><p class="muted">Respuesta al borrador ${esc(b.codigo)}</p><form onsubmit="consSaveResponse(event,'${cid}','${bid}','${rid}')">${sel('Categoría de respuesta','categoria',consEnsure().categorias_respuestas.map(x=>[x,x]),r.categoria)}<button type="button" class="mini-btn" onclick="consAddResponseCategory('${cid}','${bid}','${rid}')">+ Crear categoría</button>${field('Respuesta del comité','texto',r.texto,'textarea','required')}${field('Fecha','fecha',r.fecha,'date','required')}<div class="cons-actions"><button class="primary">Guardar respuesta</button><button type="button" onclick="closeModal()">Cancelar</button></div></form>`)}
function consAddResponseCategory(cid,bid,rid){const v=prompt('Nombre de la nueva categoría:');if(!v||!v.trim())return;const draftText=$('modal')?.querySelector('textarea[name=texto]')?.value||'';const draftDate=$('modal')?.querySelector('input[name=fecha]')?.value||today();const cat=v.trim().toLowerCase();if(!consEnsure().categorias_respuestas.includes(cat))consEnsure().categorias_respuestas.push(cat);save();consEditResponse(cid,bid,rid);const select=$('modal').querySelector('select[name="categoria"]');if(select)select.value=cat;const txt=$('modal')?.querySelector('textarea[name=texto]');if(txt)txt.value=draftText;const dt=$('modal')?.querySelector('input[name=fecha]');if(dt)dt.value=draftDate}
function consSaveResponse(e,cid,bid,rid){e.preventDefault();const b=consFind(cid,bid),v=formData(e.target);if(!b)return;b.respuestas ||= [];let r=b.respuestas.find(x=>x.id===rid);if(!r){r={id:uid(),codigo:consNextResponseCode(b)};b.respuestas.push(r)}Object.assign(r,{texto:v.texto.trim(),categoria:v.categoria,fecha:v.fecha});closeModal();commit()}
function consDeleteResponse(cid,bid,rid){if(!confirm('¿Eliminar esta respuesta?'))return;const b=consFind(cid,bid);b.respuestas=b.respuestas.filter(r=>r.id!==rid);commit()}
function consDirimir(cid,id){const b=consFind(cid,id);if(!b)return;modal(`<h2>Dirimir ${esc(b.codigo)}</h2><p class="cons-title">${esc(b.juicio)}</p><p class="cons-quiet">El dictamen reemplaza la clasificación preliminar por la decisión formal del comité.</p><form onsubmit="consSaveDecision(event,'${cid}','${id}')">${sel('Decisión del comité','dictamen',[['','Sin dictamen'],...Object.entries(CONS_DECISIONS)],b.dictamen||'')}${field('Fundamento del dictamen (opcional)','justificacion',b.justificacion||'','textarea')}<button class="primary">Guardar definición</button><button type="button" onclick="closeModal()">Cancelar</button></form>`)}
function consSaveDecision(e,cid,id){e.preventDefault();const b=consFind(cid,id),v=formData(e.target);if(!b)return;b.dictamen=v.dictamen;b.justificacion=v.justificacion;b.fecha_dictamen=v.dictamen?today():'';if(!consData(cid).borradores.every(x=>x.dictamen))consData(cid).nivel='';closeModal();commit()}
function consSetLevel(e,cid){e.preventDefault();const d=consData(cid);if(!d.borradores.length||d.borradores.some(x=>!x.dictamen))return alert('Dirime todos los borradores antes de asignar el nivel.');d.nivel=formData(e.target).nivel;commit()}
function consDefinicion(c){const d=consData(c.id),done=d.borradores.filter(x=>x.dictamen),pending=d.borradores.filter(x=>!x.dictamen),allDone=d.borradores.length>0&&!pending.length;return `<div class="panel"><h2>Definición de juicios</h2><p class="muted">Examina cada borrador y sus respuestas, y determina si representa una fortaleza, constatación, oportunidad de mejora, debilidad o si corresponde desecharlo.</p><details class="cons-fold" open><summary>Definiciones tomadas (${done.length})</summary>${done.map(b=>consDraftCard(c.id,b,'definicion')).join('')||'<p class="muted">Todavía no se han tomado definiciones.</p>'}</details><details class="cons-fold" open><summary>Definiciones por tomar (${pending.length})</summary>${pending.map(b=>consDraftCard(c.id,b,'definicion')).join('')||'<p class="muted">No hay definiciones pendientes.</p>'}</details>${allDone?`<div class="cons-level-big"><h3>Asignación del nivel del criterio</h3><p>Todos los borradores tienen un dictamen. El comité puede registrar ahora el nivel CNA de este criterio.</p><form onsubmit="consSetLevel(event,'${c.id}')">${sel('Nivel asignado','nivel',[['','Seleccione un nivel'],['1','Nivel 1'],['2','Nivel 2'],['3','Nivel 3']],d.nivel||'')}<button class="primary">Guardar nivel</button></form></div>`:`<div class="notice">Para asignar el nivel, primero deben resolverse todos los borradores. Pendientes: ${pending.length}${!d.borradores.length?' (aún no hay borradores)':''}.</div>`}</div>`}
function consFinal(c){const d=consData(c.id),groups=['fortaleza','constatacion','oportunidad','debilidad'];return `<div class="panel"><h2>Consolidado del criterio ${c.numero}</h2><div class="cons-level-big"><span> Nivel CNA asignado</span><strong>${esc(d.nivel||'—')}</strong><span>${d.nivel?'Nivel '+esc(d.nivel):'Pendiente de asignación en Definición'}</span></div>${groups.map(type=>{let arr=d.borradores.filter(b=>b.dictamen===type);return `<h3>${esc(CONS_DECISIONS[type])} (${arr.length})</h3>${arr.map(b=>consFinalCard(b,type)).join('')||'<p class="muted">Sin registros en esta categoría.</p>'}`}).join('')}</div>`}
function consDecisionColor(cat){return ({fortaleza:'azul',constatacion:'verde',oportunidad:'naranjo',debilidad:'rojo'})[cat]||'verde'}
function consFinalCard(b,cat,showCriterion=''){return `<article class="cons-card cons-${consDecisionColor(cat)}"><div class="row between"><strong>${esc(CONS_DECISIONS[cat])}</strong><span class="cons-code">${esc(b.codigo)}</span></div>${showCriterion?`<div class="cons-quiet">${esc(showCriterion)}</div>`:''}<p class="cons-title">${esc(b.juicio)}</p>${b.desarrollo?`<p class="cons-preview">${esc(b.desarrollo)}</p>`:''}${b.justificacion?`<p class="cons-quiet"><b>Fundamento del dictamen:</b> ${esc(b.justificacion)}</p>`:''}</article>`}
function consOverviewRecords(){return allCriteria().flatMap(c=>consData(c.id).borradores.filter(b=>b.dictamen&&b.dictamen!=='desechar').map(b=>({c,b})))}
function consOverview(){const records=consOverviewRecords(),groups=[['fortaleza','Fortalezas'],['oportunidad','Oportunidades de mejora'],['debilidad','Debilidades']];const list=consSummaryFilter==='todos'?['fortaleza','constatacion','oportunidad','debilidad']:consSummaryFilter?[consSummaryFilter]:[];return `<div class="panel"><div class="row between"><h2>Consolidado del proceso</h2><button class="primary" onclick="consSummaryFilter='todos';render()">Ver todas</button></div><p class="muted">Síntesis de los dictámenes aprobados, agrupados por categoría y, dentro de cada categoría, por número de criterio. Se excluyen los juicios desechados.</p>${consActions()}<div class="cons-overview">${groups.map(([k,l])=>`<button class="${consSummaryFilter===k?'selected':''}" onclick="consSummaryFilter=consSummaryFilter==='${k}'?'':'${k}';render()"><strong>${records.filter(x=>x.b.dictamen===k).length}</strong><small>${l}</small></button>`).join('')}</div>${list.map(k=>{let arr=records.filter(x=>x.b.dictamen===k).sort((a,b)=>a.c.numero-b.c.numero||a.b.codigo.localeCompare(b.b.codigo));return `<h2>${esc(CONS_DECISIONS[k])} (${arr.length})</h2>${allCriteria().map(c=>{let subset=arr.filter(x=>x.c.id===c.id);return subset.length?`<h3>Criterio ${c.numero} · ${esc(c.nombre)}</h3>${subset.map(x=>consFinalCard(x.b,k)).join('')}`:''}).join('')||'<p class="muted">Sin dictámenes en esta categoría.</p>'}`}).join('')}${!list.length?'<p class="muted">Selecciona una ficha para desplegar sus dictámenes, o pulsa «Ver todas» para visualizarlos conjuntamente.</p>':''}</div>`}
function consExport(format){let headers=['Criterio','Sección','Código','Origen / ítem','Categoría o estado','Juicio o antecedente','Desarrollo / fundamentación','Respuesta / observaciones','Fecha','Nivel CNA'];let rows=[];const codes=consCriterion==='todos'?allCriteria():[getCriterion(consCriterion)];for(const c of codes){const d=consData(c.id),base=c.numero+' · '+c.nombre;if(consCriterion==='todos'){const cats=consSummaryFilter==='todos'||!consSummaryFilter?['fortaleza','constatacion','oportunidad','debilidad']:[consSummaryFilter];for(const cat of cats)for(const b of d.borradores.filter(b=>b.dictamen===cat)){rows.push([base,'Consolidado',b.codigo,(b.item_ids||[]).join('; '),CONS_DECISIONS[cat],b.juicio,b.desarrollo,b.justificacion||'',b.fecha_dictamen||'',d.nivel||''])}continue}
if(consTab==='previo'){for(const {nivel,item:i} of acCriterionItems(c)){const obs=acItemObservations(i),inv=acItemInventario(i);rows.push([base,'Análisis previo: nivel '+nivel,i.id,inv.map(x=>(x.codigo||'')+' '+x.nombre).join('; '),stateLabel[i.estado]||i.estado,i.texto,i.fundamentacion||'',obs.map(o=>(o.tipo||'')+': '+o.texto).join(' | '),'',d.vistos.includes(i.id)?'Visto':'Por revisar'])}}else{for(const b of d.borradores){if(consTab==='consolidado'&&(!b.dictamen||b.dictamen==='desechar'))continue;rows.push([base,consTab,b.codigo,(b.item_ids||[]).join('; '),consTab==='consolidado'?CONS_DECISIONS[b.dictamen]:consTab==='definicion'?(CONS_DECISIONS[b.dictamen]||'Por dirimir'):CONS_COLORS[b.color],b.juicio,b.desarrollo||'',b.justificacion||'',b.fecha||'',d.nivel||'']);if(consTab==='borradores'||consTab==='definicion')for(const r of b.respuestas||[])rows.push([base,'Respuesta a '+b.codigo,r.codigo,b.codigo,r.categoria,'', '',r.texto,r.fecha||'',d.nivel||''])}}}
const title='Consolidar · '+(consCriterion==='todos'?'Consolidado del proceso':getCriterion(consCriterion).nombre+' · '+consTab),fname='Consolidar_'+(consCriterion==='todos'?'Proceso':consCriterion+'_'+consTab)+'_'+today();const plaintext=plainRows(title,headers,rows);if(format==='txt')return aeDownload(plaintext,fname+'.txt','text/plain;charset=utf-8');const table='<table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';if(format==='excel')return aeDownload('\ufeff<!doctype html><html><head><meta charset="utf-8"></head><body><h2>'+esc(title)+'</h2>'+table+'</body></html>',fname+'.xls','application/vnd.ms-excel;charset=utf-8');if(format==='pdf'){const html='<!doctype html><html lang="es"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font:11px Arial;color:#193146;margin:12mm}table{width:100%;border-collapse:collapse;table-layout:fixed}td,th{border:1px solid #cad8e3;padding:5px;text-align:left;vertical-align:top;overflow-wrap:anywhere;white-space:pre-wrap}th{background:#e7f1f5}tr{break-inside:avoid}@page{size:A4 landscape;margin:10mm}</style></head><body><h1>'+esc(title)+'</h1><p>'+esc(project.nombre)+' · '+today()+'</p>'+table+'</body></html>';let w=window.open('','_blank');if(!w)return alert('Permite ventanas emergentes para imprimir o guardar como PDF.');w.document.write(html);w.document.close();w.addEventListener('load',()=>{w.focus();w.print()},{once:true})}}

</script></body></html>
