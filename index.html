<script>
const TEMPLATE={"titulo": "Lista de verificación editable — Pedagogías CNA", "tipo": "propuesta_operacional_no_texto_oficial", "version": "1.0", "dimensiones": [{"id": "DI", "nombre": "Docencia y resultados del proceso formativo", "criterios": [{"id": "C1", "numero": 1, "nombre": "Perfil de egreso", "niveles": [{"numero": 1, "items": [{"id": "C1-N1-01", "texto": "El perfil de egreso está formalizado.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N1-02", "texto": "El perfil de egreso se difunde a la comunidad.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N1-03", "texto": "El perfil es coherente con los fundamentos de la profesión docente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N1-04", "texto": "El perfil es coherente con los estándares pedagógicos y disciplinarios vigentes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N1-05", "texto": "El perfil es consistente con el proyecto institucional y el modelo educativo.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N1-06", "texto": "El perfil orienta la implementación del plan de estudios.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N1-07", "texto": "El perfil es consistente con el título y grado otorgados.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 2, "items": [{"id": "C1-N2-01", "texto": "La formulación del perfil considera validación con actores internos.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N2-02", "texto": "La formulación del perfil considera validación con actores externos.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N2-03", "texto": "El perfil es conocido por profesores y estudiantes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N2-04", "texto": "El perfil es conocido por empleadores y centros de práctica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N2-05", "texto": "Existe un procedimiento formalizado de monitoreo del logro del perfil.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N2-06", "texto": "El monitoreo considera los resultados de la Evaluación Nacional Diagnóstica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 3, "items": [{"id": "C1-N3-01", "texto": "El diseño y validación del perfil sigue un proceso sistemático.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N3-02", "texto": "El proceso incorpora actores internos y externos relevantes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N3-03", "texto": "La validación se integra en un sistema formalizado de gestión curricular.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N3-04", "texto": "El sistema contempla evaluación periódica del perfil.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N3-05", "texto": "El perfil orienta la evaluación de desempeños durante la trayectoria formativa.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N3-06", "texto": "Se sistematizan resultados de inserción laboral de titulados.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N3-07", "texto": "Se sistematiza el seguimiento de titulados.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C1-N3-08", "texto": "La información de titulados se incorpora a la evaluación periódica del perfil.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}], "oficial": {"descripcion": "El Perfil de egreso es la declaración que expresa los objetivos, competencias o resultados de aprendizaje que las y los estudiantes serán capaces de demostrar al finalizar la carrera.\nEs pertinente, se encuentra actualizado según los fundamentos de la profesión docente y es consistente con la denominación del título y grado entregado. Tal perfil, orienta la gestión académica en todas las sedes, jornadas y modalidades en las que se imparte la carrera.", "niveles": {"1": "El perfil de egreso se encuentra formalizado y es difundido a la comunidad.\n\nEl perfil de egreso es coherente con los fundamentos de la profesión y los estándares pedagógicos y disciplinarios para la Formación Inicial Docente vigentes, es consistente con el proyecto institucional y con el modelo educativo de la institución.\n\nEl perfil de egreso orienta la implementación del plan de estudios y es consistente con la denominación del título y grado entregado.", "2": "El perfil de egreso es formulado considerando procesos de validación con actores relevantes, tanto internos como externos a la carrera, y es conocido por sus profesores, estudiantes, empleadores y los centros de práctica.\n\nExiste un procedimiento formalizado que permite el monitoreo del avance en el cumplimiento del perfil de egreso, dentro del cual se consideran los resultados de la Evaluación Nacional Diagnóstica.", "3": "El perfil de egreso es diseñado y validado a través de un proceso sistemático, con la participación de actores relevantes tanto internos como externos, que se enmarca en un sistema de gestión curricular formalizado que considera su evaluación periódica.\n\nLa formulación del perfil de egreso orienta la evaluación del desempeño que alcanzan las y los estudiantes en las distintas áreas de su trayectoria formativa.\n\nLa carrera sistematiza los resultados de inserción laboral y seguimiento de sus titulados, y los incorpora en el proceso de evaluación periódica del perfil de egreso."}}}, {"id": "C2", "numero": 2, "nombre": "Plan de estudios y resultados del proceso formativo", "niveles": [{"numero": 1, "items": [{"id": "C2-N1-01", "texto": "El plan de estudios se enmarca en el modelo educativo institucional.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-02", "texto": "El plan corresponde al nivel educacional para el que forma docentes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-03", "texto": "La estructura curricular explicita su relación con el perfil de egreso.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-04", "texto": "El plan considera estándares pedagógicos y disciplinarios vigentes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-05", "texto": "El plan considera la caracterización del estudiantado.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-06", "texto": "Se establecen objetivos, competencias o resultados de aprendizaje verificables.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-07", "texto": "Existen mecanismos de monitoreo y evaluación del logro del perfil.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-08", "texto": "Los mecanismos permiten evaluar resultados de la Evaluación Nacional Diagnóstica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-09", "texto": "Los mecanismos de admisión son formales, difundidos y consistentes con el plan.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-10", "texto": "Se monitorean indicadores de progresión académica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-11", "texto": "Se identifican aspectos de mejora y acciones asociadas a la progresión.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N1-12", "texto": "En programas de prosecución, el plan garantiza las competencias del grado y título correspondientes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 2, "items": [{"id": "C2-N2-01", "texto": "Se aplican sistemáticamente políticas y mecanismos de revisión y mejora curricular.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-02", "texto": "La revisión curricular considera resultados de la Evaluación Nacional Diagnóstica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-03", "texto": "Existe consistencia entre resultados de aprendizaje, evaluaciones y actividades formativas.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-04", "texto": "Se analizan sistemáticamente retención, progresión y asignaturas críticas.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-05", "texto": "Se analizan sistemáticamente tiempos de titulación y titulación oportuna.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-06", "texto": "Se definen y ejecutan acciones de mejora a partir de estos análisis.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-07", "texto": "En programas de prosecución se considera la diversidad de origen disciplinar.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-08", "texto": "En programas de prosecución se define y verifica un perfil de ingreso coherente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N2-09", "texto": "En programas de prosecución existen mecanismos de nivelación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 3, "items": [{"id": "C2-N3-01", "texto": "El plan articula coherentemente sus distintas áreas de formación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-02", "texto": "El plan es consistente con fundamentos, criterios y enfoques del modelo educativo.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-03", "texto": "Las actividades formativas y evaluativas se revisan permanentemente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-04", "texto": "Las actividades se actualizan para alcanzar los resultados de aprendizaje.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-05", "texto": "Las estrategias de enseñanza-aprendizaje articulan docencia e investigación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-06", "texto": "Existen hitos curriculares que observan progresiva e integradamente el logro del perfil.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-07", "texto": "Se evalúan resultados de acciones de mejora de retención y progresión.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-08", "texto": "Se evalúan resultados de acciones de mejora sobre asignaturas críticas y titulación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-09", "texto": "Se toman decisiones basadas en los resultados de dichas acciones.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-10", "texto": "Existe metodología para evaluar el logro del perfil y los resultados formativos.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C2-N3-11", "texto": "La metodología incorpora opiniones de titulados y contribuye a la mejora continua.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}], "oficial": {"descripcion": "El programa, regular o de prosecución de estudios, en todas sus sedes, jornadas y modalidades, cuenta con un plan de estudios consistente con el modelo educativo institucional y con el perfil de egreso declarado.\nEl plan de estudios considera los Estándares pedagógicos y disciplinarios para la Formación Inicial Docente y la normativa legal vigente.\nLa carrera cuenta con mecanismos que aseguran la efectividad de sus procesos de admisión, enseñanza-aprendizaje y progresión académica, para el logro del perfil de egreso declarado.", "niveles": {"1": "El plan de estudios se enmarca en el modelo educativo y corresponde al nivel educacional para el cual forma docentes.\n\nEl plan de estudios está estructurado en función del perfil de egreso, lo que se explicita en la organización de las actividades curriculares para su logro.\n\nEl plan de estudios considera los estándares pedagógicos y disciplinarios para la Formación Inicial Docente vigentes y la caracterización del estudiantado.\n\nLa carrera establece el logro de objetivos, competencias o resultados de aprendizaje verificables. Cuenta con mecanismos para el monitoreo y evaluación del avance de las y los estudiantes en el logro del perfil de egreso. Dichos mecanismos permiten evalúa los resultados obtenidos por estos en la Evaluación Nacional Diagnóstica.\n\nLa carrera cuenta con mecanismos de admisión formales y difundidos que son consistentes con las exigencias del plan de estudios.\n\nLa carrera monitorea los indicadores de progresión académica de las y los estudiantes, identificando posibles aspectos a mejorar y acciones tendientes a ello.\n\nEl plan de estudios de los programas de prosecución garantiza que el titulado despliega las competencias, objetivos o resultados de aprendizaje correspondientes al grado de licenciado en educación y al título profesional correspondiente.", "2": "La carrera aplica sistemáticamente políticas y mecanismos que permiten la revisión y mejora continua del plan de estudios, los que consideran los resultados de la Evaluación Nacional Diagnóstica.\n\nEl plan de estudios evidencia consistencia entre resultados de aprendizaje, evaluaciones y actividades formativas.\n\nLa carrera realiza un análisis sistemático de retención, progresión, asignaturas críticas, tiempos de titulación y titulación oportuna de las y los estudiantes, definiendo y ejecutando acciones de mejora.\n\nEl plan de estudios de los programas de prosecución considera la diversidad del origen disciplinar de las y los estudiantes y define un perfil de ingreso coherente con este. Verifica el cumplimiento efectivo de este perfil y dispone de mecanismos de nivelación que aseguran su realización.", "3": "El plan de estudios articula un proceso de formación coherente entre sus distintas áreas y es consistente con los fundamentos, criterios y enfoques definidos en el modelo educativo.\n\nLas actividades formativas y evaluativas se encuentran en permanente revisión y se actualizan para el logro de los resultados de aprendizaje.\n\nLas estrategias de enseñanzaaprendizaje que implementan las y los académicos y futuras profesoras y profesores están orientadas por la relación docencia e investigación.\n\nEl diseño curricular contempla hitos que permiten observar de forma progresiva e integrada el logro del perfil de egreso.\n\nLa carrera evalúa los resultados de la implementación de acciones tendientes al mejoramiento de los indicadores de retención, progresión, asignaturas críticas, tiempos de titulación y titulación oportuna de las y los estudiantes y, toma decisiones respecto a los resultados obtenidos.\n\nLa carrera cuenta con una metodología para evaluar el nivel de logro del perfil de egreso declarado y los resultados del proceso formativo, que considera las opiniones de titulados, lo que contribuye a su mejora continua."}}}, {"id": "C3", "numero": 3, "nombre": "Formación práctica", "niveles": [{"numero": 1, "items": [{"id": "C3-N1-01", "texto": "La formación práctica tiene carácter temprano y progresivo explícito.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N1-02", "texto": "Su progresión es consistente con el modelo educativo institucional.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N1-03", "texto": "Existe normativa de práctica que explicita el compromiso con el aprendizaje profesional.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N1-04", "texto": "La normativa establece condiciones de gestión y funciones de los actores.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N1-05", "texto": "La normativa contempla consideraciones éticas del proceso evaluativo.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N1-06", "texto": "Existe un sistema de acompañamiento y seguimiento de la formación práctica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N1-07", "texto": "Existen espacios formales definidos para la supervisión.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N1-08", "texto": "Los profesionales de centros de práctica tienen instancias de coordinación con la universidad.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 2, "items": [{"id": "C3-N2-01", "texto": "Las prácticas consideran desempeños en contextos diversos y pertinentes al título.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N2-02", "texto": "La diversidad cubre niveles educativos, áreas curriculares y contextos institucionales pertinentes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N2-03", "texto": "Los docentes tutores de centros de práctica disponen de articulación y comunicación con la universidad.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N2-04", "texto": "Dicha articulación resguarda la coherencia formativa.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N2-05", "texto": "Dicha articulación favorece capacidades docentes y de acompañamiento de tutores.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 3, "items": [{"id": "C3-N3-01", "texto": "Las actividades en centros de práctica se enfocan en el desempeño del estudiantado.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N3-02", "texto": "Las actividades se evalúan mediante seguimiento para la mejora continua.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N3-03", "texto": "La normativa de práctica considera interlocución permanente entre actores universitarios y escolares.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C3-N3-04", "texto": "La vinculación con el medio logra bidireccionalidad mediante experiencias de formación práctica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}], "oficial": {"descripcion": "La carrera diseña, implementa y monitorea un sistema u organización formal para la formación práctica, que permite a las y los estudiantes desplegar las competencias, objetivos o resultados de aprendizaje del perfil de egreso, y demostrar un desarrollo creciente de su efectividad en la docencia, en el contexto formativo.\nEsta formación es progresiva, y se sustenta en vinculación con las instituciones escolares.", "niveles": {"1": "El carácter temprano y progresivo de la formación práctica es explícito y consistente con el modelo educativo de la institución.\n\nLa carrera cuenta con normativa de práctica que explicita su compromiso con el aprendizaje profesional, condiciones de gestión, las funciones de sus principales actores y las consideraciones éticas del proceso evaluativo.\n\nLa carrera cuenta con un sistema de acompañamiento y seguimiento a la formación práctica que ha definido espacios formales para la supervisión.\n\nLas y los profesionales que apoyan el aprendizaje de las y los estudiantes, desde los centros de práctica, cuentan con instancias de coordinación con la universidad.", "2": "La carrera considera desempeños prácticos en contextos diversos que cubren los distintos niveles educativos, áreas curriculares y contextos institucionales pertinentes al título entregado.\n\nLas y los profesionales docentes (tutoras y tutores) que guían las prácticas en sus respectivos centros, cuentan con instancias de articulación y comunicación con la universidad, que resguardan la coherencia formativa, el desarrollo de sus propias capacidades docentes y de acompañamiento a las y los practicantes.", "3": "Las actividades realizadas por las y los estudiantes en los centros de práctica tienen foco en su desempeño y son evaluadas mediante un sistema de seguimiento para la mejora continua.\n\nEl reglamento o normativa de práctica considera la interlocución permanente entre distintos actores de la institución formadora con distintos actores en las comunidades educativas.\n\nLa vinculación con el medio logra bidireccionalidad, a través de espacios experienciales de formación práctica."}}}, {"id": "C4", "numero": 4, "nombre": "Cuerpo académico", "niveles": [{"numero": 1, "items": [{"id": "C4-N1-01", "texto": "La dotación académica permite atender las necesidades formativas de la carrera.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N1-02", "texto": "Existen políticas y normas para ingreso y evaluación periódica del cuerpo académico.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N1-03", "texto": "Estas normas resguardan idoneidad disciplinar, profesional y pedagógica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N1-04", "texto": "Existen instancias para transmitir el modelo educativo y sello institucional.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N1-05", "texto": "El cuerpo académico participa en instancias de análisis de sus prácticas docentes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N1-06", "texto": "Estas instancias estimulan la reflexión crítica de estudiantes sobre su futuro desempeño docente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 2, "items": [{"id": "C4-N2-01", "texto": "Existen instancias permanentes de evaluación de dotación, estabilidad y dedicación académica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N2-02", "texto": "Se evalúa el desarrollo de la carrera académica para mejorar sus indicadores.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N2-03", "texto": "Se realizan sistemáticamente actividades de desarrollo docente y disciplinar.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N2-04", "texto": "Hay académicos con experiencia en el sistema escolar.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N2-05", "texto": "Existen instancias de coordinación que articulan formación teórica y práctica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N2-06", "texto": "Se aplican formal y sistemáticamente normas de evaluación, jerarquización y carrera académica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N2-07", "texto": "Se promueven estudios e investigación disciplinar y pedagógica relevantes para formación inicial docente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 3, "items": [{"id": "C4-N3-01", "texto": "El desarrollo disciplinar y pedagógico del cuerpo académico incide en la mejora continua de la formación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N3-02", "texto": "La vinculación con el medio se considera en la evaluación académica.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N3-03", "texto": "La vinculación con el medio retroalimenta el currículo.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N3-04", "texto": "Se identifican oportunidades del entorno para desarrollar la carrera.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N3-05", "texto": "Los resultados de investigación aportan a la docencia y generación de conocimiento.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N3-06", "texto": "Los resultados aportan a creación e innovación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C4-N3-07", "texto": "Los resultados se difunden entre comunidades académicas y el sistema escolar.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}], "oficial": {"descripcion": "El cuerpo académico cuenta con la dedicación y credenciales académicas y profesionales para el desarrollo del proceso de enseñanza - aprendizaje y la implementación del plan de estudios.\nLos académicos desarrollan acciones de investigación o innovación sobre la experiencia docente, que impactan en el proceso formativo, tanto en lo disciplinar como en lo pedagógico.", "niveles": {"1": "Existen políticas y normas para el ingreso y la evaluación periódica a dicho cuerpo, para garantizar idoneidad disciplinar, profesional y pedagógica.\n\nExisten instancias de formación para transmitir el modelo educativo y el sello institucional a las y los profesores.\n\nEl cuerpo académico participa de instancias que les permiten analizar sus prácticas docentes, estimulando la reflexión crítica en las y los estudiantes para su futuro desempeño docente.", "2": "Se realizan sistemáticamente actividades de desarrollo docente y disciplinar.\n\nEl cuerpo académico cuenta con miembros con experiencia en el sistema escolar y, con las instancias de coordinación, que aseguran la coherencia formativa y articulación entre la formación teórica y práctica.\n\nLa carrera aplica de manera formal y sistemática las normas institucionales que regulan la evaluación, jerarquización y carrera de su cuerpo académico.\n\nSe promueve el desarrollo de estudios o investigación disciplinar y pedagógica relevantes para la formación inicial de profesores.", "3": "La vinculación con el medio es considerada en la evaluación académica y, al mismo tiempo, entrega oportunidades para la retroalimentación del currículo. Se identifican oportunidades en el entorno para el desarrollo de la carrera.\n\nLos resultados de la investigación aportan a la docencia, a la generación de conocimientos y a la creación e innovación, los que son difundidos entre las comunidades académicas y el sistema escolar."}}}]}, {"id": "DII", "nombre": "Gestión estratégica y recursos institucionales", "criterios": [{"id": "C5", "numero": 5, "nombre": "Gobierno y gestión de recursos", "niveles": [{"numero": 1, "items": [{"id": "C5-N1-01", "texto": "Existe instancia directiva con dedicación y atribuciones para gestionar la docencia.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-02", "texto": "La dirección vela por implementar el plan y cumplir requerimientos normativos.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-03", "texto": "Existe personal administrativo, técnico y de apoyo suficiente y capacitado.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-04", "texto": "Existe un plan de gestión con objetivos o metas de desarrollo.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-05", "texto": "Los estudiantes reciben información clara y oportuna sobre servicios.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-06", "texto": "Existe comité académico o núcleo docente que coordina actividades y condiciones de operación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-07", "texto": "El comité o núcleo considera la opinión estudiantil.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-08", "texto": "Existen instalaciones adecuadas a los requerimientos particulares de la carrera.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-09", "texto": "Existen mecanismos de planificación, adquisición y mantención de recursos materiales y tecnológicos.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N1-10", "texto": "Las condiciones se consideran en las sedes, modalidades y jornadas correspondientes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 2, "items": [{"id": "C5-N2-01", "texto": "Se evalúa la implementación de planes de mejora y gestión.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N2-02", "texto": "Los planes se ajustan según los resultados de su evaluación.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N2-03", "texto": "La coordinación entre unidades que implementan el plan opera sistemáticamente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N2-04", "texto": "Los mecanismos de adquisición, mantención, actualización y desarrollo de recursos operan transversal y sistemáticamente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N2-05", "texto": "Estos mecanismos consideran requerimientos particulares de la carrera.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N2-06", "texto": "Existen mecanismos formalizados de atención de solicitudes, inquietudes y necesidades estudiantiles.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N2-07", "texto": "Existen recursos formativos actualizados para las sedes y modalidades correspondientes.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}, {"numero": 3, "items": [{"id": "C5-N3-01", "texto": "La carrera utiliza información sobre logro de objetivos y metas para mejorar continuamente.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N3-02", "texto": "La gestión de instalaciones y equipamiento sigue políticas de vigencia tecnológica y operativa.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C5-N3-03", "texto": "La gestión considera seguimiento de satisfacción de usuarios.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}]}], "oficial": {"descripcion": "La unidad académica a la que se adscribe la carrera cuenta con un sistema de administración que define una estructura para la coordinación y para la toma de decisiones.\nSe dispone de políticas y mecanismos para la gestión administrativa de los recursos económicos, materiales y tecnológicos y con las instalaciones necesarias para el desarrollo de sus actividades.", "niveles": {"1": "La carrera cuenta con personal administrativo, técnico y de apoyo necesario y capacitado para cumplir sus funciones.\n\nLa carrera cuenta con un plan de gestión que establece objetivos o metas para su desarrollo.\n\nLas y los estudiantes disponen de información clara y oportuna sobre los servicios ofrecidos.\n\nLa carrera cuenta con un comité académico o núcleo docente que posibilita la coordinación efectiva de todas las actividades y condiciones de operación necesarias para garantizar el logro del perfil de egreso. En esta instancia se considera la opinión de las y los estudiantes.\n\nLa carrera cuenta con instalaciones y mecanismos para la planificación, adquisición y mantención de recursos materiales y tecnológicos, que responden a sus requerimientos particulares, en cada una de sus sedes, modalidades y jornadas.", "2": "Los mecanismos de coordinación de las distintas unidades involucradas en la implementación del plan de estudios operan sistemáticamente.\n\nLos mecanismos para la adquisición, mantención, actualización y desarrollo de los recursos son aplicados de manera transversal y sistemática, conside rando los requerimientos particulares de la carrera.\n\nExisten mecanismos formalizados para la atención de las solicitudes, inquietudes y necesidades de las y los estudiantes.\n\nDispone de recursos actualizados para la formación de las y los estudiantes de las distintas sedes, modalidades y carreras.", "3": "La gestión de las instalaciones y equipamiento se realiza de acuerdo con políticas de vigencia tecnológica y operativa, así como del seguimiento de la satisfacción de las y los usuarios."}}}]}, {"id": "DIII", "nombre": "Aseguramiento interno de la calidad", "criterios": [{"id": "C6", "numero": 6, "nombre": "Capacidad de autorregulación y mejora continua", "niveles": [{"numero": 1, "items": [{"id": "C6-N1-01", "texto": "Existen mecanismos de análisis crítico sistemático del desempeño y resultados.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C6-N1-02", "texto": "Se mantiene información sobre la situación de titulados.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids": []}, {"id": "C6-N1-03", "texto": "Se apoya la inserción profesional al momento de titularse.", "estado": "sin_evaluar", "fundamentacion": "", "inventario_ids": [], "observaciones": [], "editable": true, "evidencia_ids" function renderWelcome(){$('nav').innerHTML='';$('projectLabel').textContent='';$('app').innerHTML=`<div class="panel" style="max-width:680px;margin:60px auto"><h1>Bienvenido a Asistente Autoevaluación</h1><p>Comienza un proyecto nuevo o importa uno guardado en JSON. Incluye los seis criterios CNA, sus tres niveles y 131 ítems editables.</p><form onsubmit="createProject(event)">${field('Nombre del proyecto','nombre','','text','required placeholder="Ej. Autoevaluación Pedagogía en Castellano 2027"')}<button class="primary" type="submit">Crear proyecto</button> <button type="button" onclick="$('fileInput').click()">Importar proyecto JSON</button></form><p class="muted tiny">Los cambios se guardan en este navegador. Exporta copias JSON periódicamente: el almacenamiento local no es una copia de seguridad.</p></div>`}

function renderHome(){project.accesos_directos ||= [];project.notas_tareas ||= [];let cs=allCriteria(),items=cs.flatMap(allItems),evaluated=items.filter(x=>x.estado!=='sin_evaluar').length;return `<h1>Panel general</h1><p class="muted">${esc(project.nombre)} · Proyecto creado el ${esc(project.creado)}</p><div class="grid">${[['Criterios CNA',cs.length],['Ítems evaluados',evaluated+' / '+items.length],['Registros de inventario',project.inventario.length],['Juicios preliminares',project.juicios.length],['Acciones',project.acciones.length],['Jornadas',project.jornadas.length]].map(([t,v])=>`<div class="panel"><div class="metric">${v}</div><div class="muted">${t}</div></div>`).join('')}</div><div class="panel"><div class="row between"><h2>Exportar todas las verificaciones</h2><div class="export-actions"><button onclick="exportVerification('txt')">↓ TXT</button><button onclick="exportVerification('excel')">↓ Excel</button><button onclick="exportVerification('pdf')">↓ PDF</button><button onclick="exportVerification('copy')">Copiar</button></div></div><p class="tiny muted">Incluye todos los criterios y los contenidos digitados.</p></div><div class="panel home-organizer"><div class="row between"><div><h2>Accesos directos</h2><p class="muted tiny">Guarda aquí la dirección de la última versión del proyecto exportado u otros recursos de trabajo. Los enlaces se abren en otra pestaña.</p></div><button onclick="editHomeLink()">+ Añadir enlace</button></div><div class="home-card-grid">${project.accesos_directos.map(x=>`<article class="home-mini-card"><div class="row between"><strong>🔗 ${esc(x.nombre)}</strong><div class="row"><button onclick="editHomeLink('${x.id}')">Editar</button><button class="danger" onclick="deleteHomeLink('${x.id}')">Eliminar</button></div></div>${/^https?:\/\//i.test(x.url||'')?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Abrir recurso ↗</a>`:`<p class="tiny muted">${esc(x.url||'Sin enlace')}</p>`}</article>`).join('')||'<p class="muted">Todavía no hay enlaces guardados.</p>'}</div></div><div class="panel home-organizer"><div class="row between"><div><h2>Notas y tareas</h2><p class="muted tiny">Se guardan dentro del proyecto JSON. Al eliminarlas desaparecen también de la próxima exportación.</p></div><button onclick="editHomeNote()">+ Añadir nota</button></div><div class="home-card-grid">${project.notas_tareas.map(x=>`<article class="home-mini-card"><div class="row between"><strong>🗒 ${esc(x.titulo||'Nota')}</strong><div class="row"><button onclick="editHomeNote('${x.id}')">Editar</button><button class="danger" onclick="deleteHomeNote('${x.id}')">Eliminar</button></div></div><p style="white-space:pre-wrap">${esc(x.texto||'')}</p></article>`).join('')||'<p class="muted">Sin notas o tareas registradas.</p>'}</div></div><div class="panel"><h2>Avance por criterio</h2>${cs.map(c=>{let arr=allItems(c),n=arr.filter(i=>i.estado!=='sin_evaluar').length;return `<div class="item"><div class="row between"><button onclick="openCriterion('${c.id}','verificacion')">${esc(c.numero+'. '+c.nombre)}</button><span class="muted">${n}/${arr.length} evaluados</span></div><div class="bar"><span style="width:${100*n/arr.length}%;background:#3e8eaa"></span></div></div>`}).join('')}</div><div class="notice">El avance indica ítems evaluados, no cumplimiento CNA. El nivel global se determina mediante un juicio fundamentado.</div>`}

function ensureInventoryCodes(){if(!project?.inventario)return;const used={I:new Set(),M:new Set(),R:new Set()};for(const r of project.inventario){const prefix=invCodePrefix(r.tipo),match=String(r.codigo||'').match(/^([IMR])-(\d+)$/);if(match&&match[1]===prefix&&!used[prefix].has(Number(match[2])))used[prefix].add(Number(match[2]));else r.codigo='';r.anotaciones ||= {}}for(const r of project.inventario){if(r.codigo)continue;const prefix=invCodePrefix(r.tipo);let n=1;while(used[prefix].has(n))n++;used[prefix].add(n);r.codigo=prefix+'-'+String(n).padStart(3,'0')}}
function invNotes(r,cid){const data=r.anotaciones?.[cid];return Array.isArray(data)?data:[]}

function deleteInventoryNote(id,cid,nid){if(!confirm('¿Eliminar esta anotación?'))return;const r=project.inventario.find(x=>x.id===id);r.anotaciones[cid]=invNotes(r,cid).filter(x=>x.id!==nid);commit();closeModal();editInventoryNotes(id,cid)}
function invParents(r){
 const ids=Array.isArray(r.padre_ids)?r.padre_ids:(r.relaciones||[]);
 return ids.filter(id=>id!==r.id&&project.inventario.some(x=>x.id===id&&invLevels.indexOf(x.tipo)<invLevels.indexOf(r.tipo)));
}
function invChildren(id,scope=null){return (scope||project.inventario).filter(r=>invParents(r).includes(id))}
function invScope(cid=''){
 if(!cid)return project.inventario;
 let direct=project.inventario.filter(r=>(r.criterios||[]).includes(cid)),ids=new Set(direct.map(r=>r.id)),changed=true;
 while(changed){changed=false;for(const r of project.inventario)if(ids.has(r.id)){for(const p of invParents(r))if(!ids.has(p)){ids.add(p);changed=true}}}
 return project.inventario.filter(r=>ids.has(r.id));
}
function invTreeRoots(scope){let ids=new Set(scope.map(r=>r.id));return scope.filter(r=>!invParents(r).some(id=>ids.has(id)))}
function invDescendant(id,target,seen=new Set()){if(id===target)return true;if(seen.has(id))return false;seen.add(id);return invChildren(id).some(x=>invDescendant(x.id,target,seen))}
function invCompactCard(r,scope=project.inventario,depth=0,seen=new Set(),filtered=false,cid=''){
 if(seen.has(r.id))return '';seen=new Set(seen);seen.add(r.id);
 const children=invChildren(r.id,scope), count=cid?invNotes(r,cid).length:0;
 return `<div class="inv-node" style="--inv-depth:${depth}"><div class="inv-entry-row"><button class="inv-compact inv-${esc(r.tipo)}" onclick="viewInventory('${r.id}')"><span class="inv-code">${esc(r.codigo||'')}</span><span class="inv-symbol">${{institucional:'▣',mecanismo:'◇',registro:'▤',antecedente:'•'}[r.tipo]||'•'}</span><span class="inv-compact-name">${esc(r.nombre)}</span>${invOriginBadge(r)}<span class="inv-kind">${esc(names[r.tipo]||r.tipo)}</span>${children.length?`<span class="inv-childcount">${children.length} dependiente${children.length===1?'':'s'}</span>`:''}${filtered&&invParents(r).length?'<span class="inv-nested">↳ Anidado</span>':''}<span aria-hidden="true">›</span></button>${cid?`<button class="inv-annot-btn" title="Ver o agregar anotaciones del criterio" onclick="editInventoryNotes('${r.id}','${cid}')">✎ ${count}</button>`:''}</div>${!filtered&&children.length?`<div class="inv-branch">${children.map(c=>invCompactCard(c,scope,depth+1,seen,false,cid)).join('')}</div>`:''}</div>`;
}
function invTree(scope,filtered=false,cid=''){
 const list=filtered?scope:invTreeRoots(scope);
 return `<div class="inv-tree">${list.map(r=>invCompactCard(r,scope,0,new Set(),filtered,cid)).join('')||'<p class="muted">No hay registros.</p>'}</div>`;
}
function invBranchDetails(id,depth=0,seen=new Set()){
 if(seen.has(id)||depth>15)return '';seen.add(id);
 let children=invChildren(id);
 return children.length?`<details class="inv-expand" open><summary>Ramificaciones (${children.length})</summary>${children.map(c=>`<div class="inv-branch-detail"><button onclick="viewInventory('${c.id}')">${esc(c.nombre)}</button> <span class="pill">${names[c.tipo]||c.tipo}</span>${invBranchDetails(c.id,depth+1,new Set(seen))}</div>`).join('')}</details>`:'';
}

 };

function deleteInventory(id){if(!confirm('Eliminar este registro del inventario y desvincularlo de las verificaciones?'))return;project.inventario=project.inventario.filter(x=>x.id!==id);for(let c of allCriteria())for(let i of allItems(c))i.inventario_ids=(i.inventario_ids||[]).filter(x=>x!==id);for(let r of project.inventario){r.relaciones=(r.relaciones||[]).filter(x=>x!==id);r.padre_ids=(r.padre_ids||[]).filter(x=>x!==id)}closeModal();commit()}
function renderSessions(){return `<div class="row between page-intro"><div><span class="eyebrow">REGISTRO PARTICIPATIVO</span><h1>Ejercicios de autoevaluación</h1><p class="muted">Revisa cada instancia, sus participantes y los juicios preliminares construidos. Los juicios pueden editarse aquí mismo.</p></div><button class="primary" onclick="editSession()">+ Nuevo ejercicio</button></div><div class="session-grid">${project.jornadas.length?project.jornadas.slice().sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||''))).map(s=>{const judgments=project.juicios.filter(j=>j.jornada_id===s.id);const strengths=judgments.filter(j=>j.categoria==='fortaleza').length,improvements=judgments.filter(j=>j.categoria==='oportunidad').length;return `<article class="session-card"><div class="session-head"><div><span class="eyebrow">EJERCICIO · ${esc(s.fecha||'Sin fecha')}</span><h2>${esc(s.nombre)}</h2></div><div class="row"><button class="subtle" onclick="editSession('${s.id}')">Editar ejercicio</button><button class="danger mini-btn" onclick="deleteSession('${s.id}')">Eliminar</button></div></div><div class="session-body"><p class="session-description">${esc(s.temas||'Sin temas descritos')}</p><div class="session-metrics"><span>👩‍🏫 ${esc(s.profesores||0)} profesores</span><span>🎓 ${esc(s.estudiantes||0)} estudiantes</span><span>🤝 ${esc(s.externos||0)} externos</span></div>${s.acta?`<div class="session-reference">${refsBlock([{nombre:'Acta / referencia',url:s.acta}])}</div>`:''}</div><section class="session-judgments"><div class="row between"><div><h3>Juicios preliminares <span class="count-chip">${judgments.length}</span></h3><div class="tiny muted">${strengths} fortalezas · ${improvements} oportunidades de mejora</div></div><button class="primary mini-btn" onclick="editJudgment('','${s.id}')">+ Añadir juicio</button></div>${judgments.length?`<div class="judgment-mini-list">${judgments.map(j=>`<article class="judgment-mini ${esc(j.categoria||'neutral')}"><div class="row between"><span class="pill ${esc(j.categoria||'neutral')}">${esc(catLabel[j.categoria]||'Neutral')}</span>${stageBadge(j)}</div><p>${esc(j.texto||'Sin contenido')}</p><div class="row between"><span class="tiny muted">${esc(j.fecha||'')} ${chips(j.criterios||[])}</span><button class="mini-btn" onclick="editJudgment('${j.id}')">Editar juicio</button></div></article>`).join('')}</div>`:'<div class="session-empty">Todavía no hay juicios preliminares asociados a este ejercicio.</div>'}</section></article>`}).join(''):'<div class="panel empty-state"><h2>Sin ejercicios registrados</h2><p class="muted">Crea el primero para documentar acuerdos y juicios preliminares.</p><button class="primary" onclick="editSession()">Crear primer ejercicio</button></div>'}</div>`}
function editSession(id){let s=project.jornadas.find(x=>x.id===id)||{nombre:'',fecha:today(),temas:'',acta:'',profesores:0,estudiantes:0,externos:0};modal(`<h2>${id?'Editar':'Nueva'} jornada</h2><form onsubmit="saveSession(event,'${id||''}')">${field('Nombre de la instancia','nombre',s.nombre,'text','required')}${field('Fecha','fecha',s.fecha,'date','required')}${field('Temas abordados','temas',s.temas,'textarea')}${field('Evidencia: nombre del acta','acta',s.acta||'')}${field('Enlace del acta (opcional)','acta_url',s.acta_url||'','url')}<div class="grid">${field('Profesores','profesores',s.profesores,'number','min="0"')}${field('Estudiantes','estudiantes',s.estudiantes,'number','min="0"')}${field('Externos','externos',s.externos,'number','min="0"')}</div><button class="primary">Guardar</button> <button type="button" onclick="closeModal()">Cancelar</button></form>`)}
function saveSession(e,id){e.preventDefault();let d=formData(e.target),s=project.jornadas.find(x=>x.id===id);if(!s){s={id:uid()};project.jornadas.push(s)}Object.assign(s,d);closeModal();commit()}
// Se elimina exclusivamente el ejercicio. Los juicios, acciones e historiales son registros
// independientes: los juicios conservan una referencia descriptiva de su origen eliminado.
function deleteSession(id){
 const session=project?.jornadas?.find(x=>x.id===id);if(!session)return;
 const linked=(project.juicios||[]).filter(j=>j.jornada_id===id);
 const message=`¿Eliminar definitivamente el ejercicio «${session.nombre}»?\n\n${linked.length} juicio(s) relacionado(s) se conservarán con su origen histórico registrado, pero sin vinculación a un ejercicio activo. También se conservarán sus acciones, estados y seguimientos.\n\nLa eliminación del ejercicio se reflejará inmediatamente en el proyecto y en Seguimiento.`;
 if(!confirm(message))return;
 const origin={id:session.id,nombre:session.nombre||'',fecha:session.fecha||'',acta:session.acta||'',acta_url:session.acta_url||''};
 for(const j of linked){
  if(!j.origen_ejercicio_eliminado)j.origen_ejercicio_eliminado=structuredClone(origin);
  j.jornada_id='';
 }
 project.jornadas=project.jornadas.filter(x=>x.id!==id);
 if(document.getElementById('modal')?.open)closeModal();
 commit();
}
function deleteFollowupAction(id){
 const a=project?.acciones?.find(x=>x.id===id);if(!a)return;
 if(!confirm(`¿Eliminar la acción «${a.nombre}» de Seguimiento? Se eliminará su historial propio y se actualizarán de inmediato los resúmenes, sin modificar los juicios vinculados.`))return;
 project.acciones=project.acciones.filter(x=>x.id!==id);
 commit();
}
function deleteFollowupTask(id){
 const o=project?.observaciones?.find(x=>x.id===id);if(!o)return;
 if(!confirm('¿Eliminar esta tarea del proyecto y del JSON exportado?'))return;
 project.observaciones=project.observaciones.filter(x=>x.id!==id);
 commit();
}
function stageBadge(j){let st=judgmentStatus(j);return `<span class="pill judgment-status-${st}">${stageLabel[st]||'Pendiente'}</span>`}
// Grupos de juicios equivalentes: cada juicio conserva su ID, ejercicio de origen y redacción.
function judgmentGroup(j){return j?.grupo_id?project.juicios.filter(x=>x.grupo_id===j.grupo_id):j?[j]:[]}
function judgmentGroupIds(j){return judgmentGroup(j).map(x=>x.id)}
function judgmentGroupActions(j){const ids=new Set(judgmentGroupIds(j));return project.acciones.filter(a=>(a.juicio_ids||[]).some(id=>ids.has(id)))}
function groupJudgmentsDialog(id){
 const j=project.juicios.find(x=>x.id===id);if(!j||j.categoria!=='oportunidad')return;
 const grp=judgmentGroup(j),current=new Set(grp.map(x=>x.id));
 const others=project.juicios.filter(x=>x.categoria==='oportunidad'&&!current.has(x.id));
 modal(`<h2>Agrupar juicios evaluativos similares</h2><p class="muted">Se conserva la ficha individual, su texto, fecha y ejercicio de origen. Las acciones se comparten; cuando se marque el grupo como superado, todos sus juicios pasarán a Superado.</p><div class="notice"><b>Juicio de referencia:</b> ${esc(j.texto)}</div><h3>Actualmente agrupados (${grp.length})</h3>${grp.map(x=>`<p class="tiny">${esc(x.texto)} · ${esc(project.jornadas.find(y=>y.id===x.jornada_id)?.nombre||'Sin ejercicio')}</p>`).join('')}<form onsubmit="mergeJudgments(event,'${id}')"><h3>Añadir juicios similares</h3><div style="max-height:300px;overflow:auto">${others.map(x=>`<label class="row tiny" style="padding:8px;border-bottom:1px solid #edf1f4"><input type="checkbox" name="agregar" value="${esc(x.id)}"><span>${esc(x.texto)} <small class="muted">(${esc(project.jornadas.find(e=>e.id===x.jornada_id)?.nombre||'Sin ejercicio')})</small></span></label>`).join('')||'<p class="muted">No quedan oportunidades de mejora por agrupar.</p>'}</div><div class="row"><button class="primary">Agrupar seleccionados</button><button type="button" onclick="closeModal()">Cancelar</button>${grp.length>1?`<button type="button" onclick="separateJudgment('${id}')">Separar este juicio</button>`:''}</div></form>`);
}
function mergeJudgments(e,id){e.preventDefault();const ref=project.juicios.find(x=>x.id===id);if(!ref)return;const selected=[...e.target.querySelectorAll('input[name=agregar]:checked')].map(el=>el.value),members=new Map(judgmentGroup(ref).map(x=>[x.id,x]));
 for(const oid of selected){const other=project.juicios.find(x=>x.id===oid);if(other&&other.categoria==='oportunidad')for(const m of judgmentGroup(other))members.set(m.id,m)}
 if(members.size<2){alert('Selecciona al menos otro juicio.');return}
 const groupId=ref.grupo_id||('JG-'+uid()),ids=[...members.keys()];
 for(const j of members.values()){j.grupo_id=groupId;j.historial||=[];j.historial.push({fecha:today(),texto:'Juicio agrupado con otras evaluaciones semejantes. Se mantienen origen y contenido individuales.'})}
 for(const a of project.acciones){if((a.juicio_ids||[]).some(x=>ids.includes(x)))a.juicio_ids=[...new Set([...(a.juicio_ids||[]),...ids])]}
 closeModal();commit();
}
function separateJudgment(id){const j=project.juicios.find(x=>x.id===id);if(!j||!j.grupo_id)return;if(!confirm('¿Separar este juicio del grupo? Conservará su origen, su historial y las acciones que ya tuviera vinculadas.'))return;
 const former=j.grupo_id;delete j.grupo_id;j.historial||=[];j.historial.push({fecha:today(),texto:'Juicio separado del grupo; se conserva su historial.'});const rest=project.juicios.filter(x=>x.grupo_id===former);if(rest.length===1)delete rest[0].grupo_id;closeModal();commit()}
function judgmentCard(j){
 const event=project.jornadas.find(x=>x.id===j.jornada_id),st=judgmentStatus(j),isOpportunity=j.categoria==='oportunidad';
 const acts=judgmentGroupActions(j),group=judgmentGroup(j);
 return `<article class="prev-card judgment-card prev-${esc(j.categoria)} ${st==='desestimado'?'judgment-dismissed':''}"><div class="row between"><span class="prev-chip ${esc(j.categoria)}">${esc(catLabel[j.categoria]||'Reconocimiento')}</span>${stageBadge(j)}<div class="row">${isOpportunity?`<button class="mini-btn" onclick="groupJudgmentsDialog('${j.id}')">${group.length>1?'Grupo · '+group.length:'Agrupar'}</button>`:''}<button class="mini-btn" onclick="editJudgment('${j.id}')">Editar</button><button class="mini-btn danger" onclick="deleteJudgment('${j.id}')">Eliminar</button></div></div>${group.length>1?`<p class="tiny muted">Vinculado a ${group.length-1} juicio(s) similar(es). Cada ficha conserva su ejercicio y redacción.</p>`:''}<p class="prev-statement">${esc(j.texto)}</p><p class="muted tiny">${esc(j.fecha||'')} · ${esc(event?.nombre||j.fuente||'Sin instancia')} · ${chips(j.criterios)}</p><div class="judgment-followup"><label class="tiny"><strong>Estado del juicio</strong><select aria-label="Estado del juicio" onchange="setJudgmentStatus('${j.id}',this.value)">${Object.entries(stageLabel).map(([v,t])=>`<option value="${v}" ${st===v?'selected':''}>${t}</option>`).join('')}</select></label></div>${st==='desestimado'?'<p class="tiny muted">Desestimado: no se utiliza como antecedente CNA.</p>':''}${(j.historial||[]).length?`<details><summary>Historial de seguimiento (${j.historial.length})</summary>${j.historial.map(h=>`<p class="tiny">${esc(h.fecha)} — ${esc(h.texto)} ${evidenceView(h)}</p>`).join('')}</details>`:''}${isOpportunity?`<div class="judgment-actions"><h4>Acciones asociadas</h4>${acts.map(a=>`<div class="prev-mini"><div class="row between"><strong>${esc(a.nombre)}</strong><span class="pill">${esc(a.estado)}</span></div><button class="mini-btn" onclick="editAction('${a.id}')">Ver / editar acción</button></div>`).join('')||'<p class="tiny muted">Sin acciones vinculadas.</p>'}<button class="mini-btn" onclick="editAction('','${j.id}')">+ Vincular nueva acción</button>${linkedJudgmentNotice(j)}</div>`:acts.length?`<details><summary class="tiny">${acts.length} acción(es) vinculada(s) previamente</summary><p class="tiny muted">Vínculos históricos conservados. Solo las oportunidades de mejora admiten nuevas acciones.</p>${acts.map(a=>`<p class="tiny">${esc(a.nombre)} · ${esc(a.estado)}</p>`).join('')}</details>`:''}</article>`;
}
function renderJudgments(){
 const order=[['oportunidad','Oportunidades de mejora'],['fortaleza','Fortalezas'],['neutral','Reconocimientos']];
 return `<div class="row between page-intro"><div><h1>Juicios preliminares</h1><p class="muted">Las acciones corresponden exclusivamente a oportunidades de mejora. Los demás juicios se mantienen como antecedentes evaluativos.</p></div><button class="primary" onclick="editJudgment()">+ Nuevo juicio</button></div>${order.map(([cat,label])=>{const arr=project.juicios.filter(j=>j.categoria===cat||(cat==='neutral'&&j.categoria==='reconocimiento')).sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));return `<section><h2>${label} (${arr.length})</h2><div class="prev-grid judgment-grid">${arr.map(judgmentCard).join('')||'<p class="muted">Sin juicios registrados.</p>'}</div></section>`}).join('')}`;
}
function editJudgment(id,sessionId=''){let j=project.juicios.find(x=>x.id===id)||{texto:'',fecha:invDateFromSource('juicio',sessionId),jornada_id:sessionId,categoria:'neutral',criterios:section==='criterios'?[criterionId]:[],historial:[]};modal(`<h2>${id?'Editar':'Nuevo'} juicio preliminar</h2><form onsubmit="saveJudgment(event,'${id||''}')">${field('Contenido del juicio','texto',j.texto,'textarea','required')}${field('Fecha','fecha',j.fecha,'date')}${sel('Categoría','categoria',[['neutral','Neutral'],['fortaleza','Fortaleza'],['oportunidad','Oportunidad de mejora']],j.categoria)}${sel('Instancia de origen','jornada_id',[['','Sin jornada registrada'],...project.jornadas.map(s=>[s.id,s.nombre])],j.jornada_id).replace('<select ','<select onchange="updateJudgmentDateFromSession(this)" ')}${field('Evidencia: fuente o documento','fuente',j.fuente||'')}${field('Enlace de la fuente (opcional)','fuente_url',j.fuente_url||'','url')}<h3>Inventario vinculado</h3>${inventoryLinkField('inventario_ids',j.inventario_ids||[],'')}<h3>Criterios asociados</h3><div class="grid">${choices(j.criterios||[])}</div><div class="row"><button class="primary">Guardar</button><button type="button" onclick="closeModal()">Cancelar</button>${id?`<button type="button" class="danger" onclick="deleteJudgment('${id}')">Eliminar juicio</button>`:''}</div></form>${id?`<hr><h3>Añadir actualización al historial</h3><form onsubmit="addHistory(event,'${id}')">${field('Fecha','fecha',today(),'date')}${field('Actualización','texto','','textarea','required')}${evidenceFields({evidencia_nombre:'',evidencia_url:''})}<button>Agregar actualización</button></form><h3>Historial</h3>${(j.historial||[]).map(h=>`<p>${esc(h.fecha)} · ${esc(h.texto)}</p>`).join('')}`:''}`)}
function saveJudgment(e,id){e.preventDefault();let d=formData(e.target),j=project.juicios.find(x=>x.id===id);if(!j){j={id:uid(),historial:[],estado:'pendiente'};project.juicios.push(j)}Object.assign(j,d,{criterios:chosen(e.target),inventario_ids:invSelected(e.target,'inventario_ids')});closeModal();commit()}
function setJudgmentStatus(id,status){if(!Object.hasOwn(stageLabel,status))return;const j=project.juicios.find(x=>x.id===id);if(!j)return;const group=status==='superado'?judgmentGroup(j):[j];for(const target of group){const previous=judgmentStatus(target);if(previous!==status){target.estado=status;target.historial ||= [];target.historial.push({fecha:today(),texto:`Estado actualizado: ${stageLabel[previous]} → ${stageLabel[status]}${group.length>1?' (grupo de juicios equivalentes)':''}`})}}commit()}

function deleteJudgment(id){const j=project.juicios.find(x=>x.id===id);if(!j)return;if(!confirm('¿Eliminar definitivamente este juicio preliminar? Se desvinculará de las acciones existentes, pero las acciones no se borrarán. Esta operación no se puede deshacer.'))return;project.juicios=project.juicios.filter(x=>x.id!==id);for(const a of project.acciones)a.juicio_ids=(a.juicio_ids||[]).filter(ref=>ref!==id);closeModal();commit()}
function addHistory(e,id){e.preventDefault();let j=project.juicios.find(x=>x.id===id);j.historial.push(formData(e.target));closeModal();commit()}
function renderCriteria(){let c=getCriterion(criterionId)||allCriteria()[0];let tabs=[['norma','1. Criterio CNA'],['inventario','2. Inventario'],['anteriores','3. Proceso anterior'],['juicios','4. Juicios preliminares'],['verificacion','5. Verificación'],['analisis','6. Análisis consolidado']];return `<div class="split"><aside class="panel"><h2>Dimensiones y criterios</h2>${project.catalogo.dimensiones.map(d=>`<h3>${esc(d.id)}. ${esc(d.nombre)}</h3>${d.criterios.map(x=>`<button class="cardbtn ${c.id===x.id?'primary':''}" onclick="openCriterion('${x.id}',criterionTab)">${esc(x.numero+'. '+x.nombre)}</button>`).join('')}`).join('')}</aside><div><div class="panel"><p class="muted tiny">CRITERIO ${c.numero}</p><h1>${esc(c.nombre)}</h1><div class="tabs">${tabs.map(([id,t])=>`<button class="${criterionTab===id?'active':''}" onclick="criterionTab='${id}';render()">${t}</button>`).join('')}</div>${({norma:tabNorma,inventario:tabInventory,anteriores:tabPreviousCriterion,juicios:tabJudgments,verificacion:tabCheck,analisis:tabAnalysis}[criterionTab]||tabNorma)(c)}</div></div></div>`}
function tabNorma(c){return `<div class="notice">Texto de referencia oficial CNA, separado de los ítems operativos editables.</div><h2>Descripción del criterio</h2><p style="white-space:pre-line">${esc(c.oficial.descripcion)}</p>${[1,2,3].map(n=>`<details class="level" open><summary>Nivel ${n}</summary><div style="padding:15px;white-space:pre-line;line-height:1.65">${esc(c.oficial.niveles[n])}</div></details>`).join('')}`}
function tabInventory(c){let arr=invScope(c.id);return `<div class="row between"><h2>Inventario asociado</h2><div class="export-actions"><button onclick="exportInventory('txt','${c.id}')">↓ TXT</button><button onclick="exportInventory('excel','${c.id}')">↓ Excel</button><button onclick="exportInventory('pdf','${c.id}')">↓ PDF</button><button onclick="exportInventory('copy','${c.id}')">Copiar</button><button onclick="editInventory()">+ Crear</button></div></div>${invTree(arr,false,c.id)}<p class="muted tiny">El botón ✎ muestra la cantidad de anotaciones específicas de este criterio. Selecciónalo para añadir, leer o editar contribuciones. Selecciona una ficha para ver documentos, relaciones y ramificaciones.</p>`}

function tabJudgments(c){let arr=activeCriterionJudgments(c.id);return `<h2>Juicios preliminares asociados</h2><p class="muted tiny">Consulta de solo lectura. Edita estados y acciones en el módulo Juicios preliminares.</p>${arr.map(j=>`<div class="judgment-mini ${esc(j.categoria)}"><div class="row between"><span class="pill ${esc(j.categoria)}">${esc(catLabel[j.categoria]||'Neutral')}</span>${stageBadge(j)}</div><p>${esc(j.texto)}</p><span class="muted tiny">${esc(j.fecha||'')} · ${esc(project.jornadas.find(x=>x.id===j.jornada_id)?.nombre||j.fuente||'')}</span></div>`).join('')||'<p class="muted">Sin juicios vinculados a este criterio.</p>'}` }

function progress(items){let counts={cumple:0,parcial:0,no_cumple:0,sin_evaluar:0,no_aplica:0};items.forEach(i=>counts[i.estado||'sin_evaluar']++);return `<div class="row between tiny"><span>${counts.cumple} cumple · ${counts.parcial} parcial · ${counts.no_cumple} no cumple · ${counts.sin_evaluar} sin evaluar · ${counts.no_aplica} no aplica</span></div><div class="bar">${[['cumple','#328e6c'],['parcial','#e3aa42'],['no_cumple','#d35b61'],['no_aplica','#a9b3c0']].map(([k,color])=>`<span style="width:${100*counts[k]/Math.max(items.length,1)}%;background:${color}"></span>`).join('')}</div>`}
function tabCheck(c){return `<div class="row between"><h2>Lista de verificación editable</h2><div class="export-actions"><button onclick="exportVerification('txt','${c.id}')">↓ TXT</button><button onclick="exportVerification('excel','${c.id}')">↓ Excel</button><button onclick="exportVerification('pdf','${c.id}')">↓ PDF</button><button onclick="exportVerification('copy','${c.id}')">Copiar</button></div></div><p class="muted">Selecciona una exigencia para evaluar, fundamentar, asociar registros del inventario y declarar observaciones.</p>${c.niveles.map(l=>`<details class="level" open><summary>Nivel ${l.numero} · ${l.items.length} exigencias</summary><div style="padding:12px">${progress(l.items)}${l.items.map(i=>`<div class="item"><div class="row between"><span class="muted tiny">${esc(i.id)}</span><span class="pill">${stateLabel[i.estado]||'Sin evaluar'}</span></div><p>${esc(i.texto)}</p>${i.fundamentacion?`<p class="muted tiny">${esc(i.fundamentacion)}</p>`:''}<div class="row">${linkInventario(i.inventario_ids)}${previousActionLinks(i)}<button onclick="editCheck('${c.id}',${l.numero},'${i.id}')">Evaluar / editar</button></div>${project.observaciones.filter(o=>o.item_id===i.id).map(o=>`<span class="pill ${o.tipo}">${catLabel[o.tipo]}</span>`).join(' ')}</div>`).join('')}<button onclick="addCheck('${c.id}',${l.numero})">+ Añadir ítem al nivel ${l.numero}</button></div></details>`).join('')}`}
function editCheck(cid,n,id){let c=getCriterion(cid),l=c.niveles.find(x=>x.numero===n),i=l.items.find(x=>x.id===id);modal(`<h2>Evaluar exigencia ${esc(id)}</h2><form onsubmit="saveCheck(event,'${cid}',${n},'${id}')">${field('Texto del ítem (editable)','texto',i.texto,'textarea','required')}${sel('Estado de cumplimiento','estado',Object.entries(stateLabel),i.estado)}${field('Fundamentación','fundamentacion',i.fundamentacion||'','textarea')}<h3>Asociar elementos del inventario</h3>${inventoryLinkField('inventario',i.inventario_ids||[],cid)}<h3>Asociar acciones de planes de mejora anteriores</h3><div class="grid">${previousActionCheckboxes(i)}</div><div class="row"><button class="primary">Guardar evaluación</button><button type="button" onclick="closeModal()">Cancelar</button><button type="button" class="danger" onclick="archiveCheck('${cid}',${n},'${id}')">Archivar ítem</button></div></form><hr><h3>Observaciones de este ítem</h3>${project.observaciones.filter(o=>o.item_id===id).map(o=>`<div class="item"><span class="pill ${o.tipo}">${catLabel[o.tipo]}</span> ${esc(o.texto)} <button onclick="editObservation('${o.id}')">Editar</button></div>`).join('')||'<p class="muted">Sin observaciones.</p>'}<button onclick="editObservation('','${cid}','${id}')">+ Añadir observación</button>`)}
function saveCheck(e,cid,n,id){e.preventDefault();let i=getCriterion(cid).niveles.find(x=>x.numero===n).items.find(x=>x.id===id),d=formData(e.target);Object.assign(i,{texto:d.texto,estado:d.estado,fundamentacion:d.fundamentacion,inventario_ids:invSelected(e.target,'inventario'),plan_mejora_ids:[...e.target.querySelectorAll('input[name=plan_mejora]:checked')].map(x=>x.value)});closeModal();commit()}
function archiveCheck(cid,n,id){if(!confirm('¿Archivar el ítem? Se ocultará de la verificación activa, pero se conservarán sus datos.'))return;let l=getCriterion(cid).niveles.find(x=>x.numero===n),i=l.items.find(x=>x.id===id);l.archivados||=[];l.archivados.push(i);l.items=l.items.filter(x=>x.id!==id);closeModal();commit()}
function addCheck(cid,n){modal(`<h2>Nuevo ítem · Nivel ${n}</h2><form onsubmit="saveNewCheck(event,'${cid}',${n})">${field('Exigencia verificable','texto','','textarea','required')}<button class="primary">Añadir</button></form>`)}

function editObservation(id,cid='',itemId=''){let o=project.observaciones.find(x=>x.id===id)||{criterio_id:cid||criterionId,item_id:itemId,tipo:'tarea',texto:'',fecha:today(),estado:'pendiente'};modal(`<h2>${id?'Editar':'Nueva'} observación</h2><form onsubmit="saveObservation(event,'${id||''}')">${sel('Tipo','tipo',[['tarea','Tarea'],['fortaleza','Fortaleza'],['oportunidad','Oportunidad de mejora']],o.tipo)}${field('Observación','texto',o.texto,'textarea','required')}${field('Fecha','fecha',o.fecha,'date')}${sel('Estado de seguimiento','estado',[['pendiente','Pendiente'],['proyectada','Proyectada'],['diseno','En diseño'],['ejecucion_inicial','En ejecución inicial'],['ejecucion','En ejecución'],['completada','Completada']],o.estado)}<button class="primary">Guardar</button></form>`)}
